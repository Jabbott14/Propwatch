name: collect-cbb
# College basketball collector. Each job snapshots every 10 min for ~5h20m.
# Continuity: when a job finishes it immediately dispatches the next one, so there is
# no gap waiting for a cron firing. The hourly cron is only a backstop in case a
# dispatch fails; the concurrency group keeps a single runner at a time (overlapping
# runs would fight over cbb/state/collector.json).
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect-cbb
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: collect loop
        continue-on-error: true
        run: python3 cbb/collect.py .
      - name: start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect_cbb.yml --ref "${{ github.ref_name }}"
