name: grade-periods-cbb

# Propwatch CBB PERIOD grader — halves and half team totals. Writes:
#   cbb/graded/periods.json          every graded period market at two checkpoints
#   cbb/graded/periods_summary.json  each signal's record as data
#   cbb/PERIODS_SCORECARD.md         readable, base-rate corrected
#   cbb/PERIODS_BOARD.md             live markets with each signal's record
#
# Needs no collector change: retail halves are already in cbb/props, the sharp
# reference is cbb/pin at period 1, and cbb/finals carries h1a/h1h to settle them.

on:
  schedule:
    - cron: "31 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade-periods-cbb
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Grade CBB periods and build the board
        run: |
          python3 - . <<'PY'

          #!/usr/bin/env python3
          """Propwatch CBB PERIOD grader + board — halves and half team totals. Stdlib only.

            cbb/graded/periods.json          every graded period market at two checkpoints
            cbb/graded/periods_summary.json  each signal's record as data
            cbb/PERIODS_SCORECARD.md         readable, base-rate corrected
            cbb/PERIODS_BOARD.md             live markets with each signal's record beside its call

          College first halves are heavily bet and the system has never graded one. Everything
          needed was already being collected:

            retail   cbb/props -- 1ST_HALF_HANDICAP / _TOTAL_POINTS / _WINNER and the 2ND_HALF_*
                     family, which FanDuel settles including overtime
            sharp    cbb/pin at period 1 -- spread, total, moneyline and team totals
            results  cbb/finals carries h1a / h1h, the first-half score for each side, so the
                     second half is simply (final - first half) and already includes OT

          There are no tickets/money splits on any period market -- the Action Network splits feed
          is full-game only -- so every signal here is handicap or price. Across 850+ graded events
          that is the half that works anyway.

          Signals:
            follow_move  FanDuel moved the handicap; take the side it moved toward
            fd_juice     handicap unchanged, price moved >= JUICE_C cents; take the side getting
                         more expensive -- money against a number the book will not move
            pin_value    FanDuel's handicap sits on the better side of Pinnacle's (1st half only)
            pin_price    same handicap, FanDuel's price beats Pinnacle's no-vig fair (1st half)
          """
          import gzip, json, os, sys, glob, math, re, collections, datetime as dt

          REPO = sys.argv[1] if len(sys.argv) > 1 else "."
          C = lambda *a: os.path.join(REPO, "cbb", *a)
          EARLY_MIN = 60
          MIN_N = 50
          JUICE_C = 12
          BREAKEVEN = 0.524
          SIGNALS = ("pin_value", "pin_price", "follow_move", "fd_juice")
          KIND = {"spread": ("home", "away"), "total": ("over", "under"),
                  "ml": ("home", "away"), "tt": ("over", "under")}

          FD_MT = {"1ST_HALF_HANDICAP": ("1h", "spread"), "1ST_HALF_TOTAL_POINTS": ("1h", "total"),
                   "1ST_HALF_WINNER": ("1h", "ml"),
                   "2ND_HALF_HANDICAP": ("2h", "spread"), "2ND_HALF_TOTAL_POINTS": ("2h", "total"),
                   "2ND_HALF_WINNER": ("2h", "ml"),
                   "1ST_HALF_HOME_TEAM_TOTAL": ("1h", "tt_home"),
                   "1ST_HALF_AWAY_TEAM_TOTAL": ("1h", "tt_away"),
                   "2ND_HALF_HOME_TEAM_TOTAL": ("2h", "tt_home"),
                   "2ND_HALF_AWAY_TEAM_TOTAL": ("2h", "tt_away")}
          PIN_KIND = {"spread": "spread", "total": "total", "moneyline": "ml",
                      "team_total": "tt"}


          def nm(s): return re.sub(r"[^a-z0-9 ]", "", (s or "").lower()).strip()
          def T(s): return dt.datetime.strptime(s, "%Y-%m-%dT%H%MZ").replace(tzinfo=dt.timezone.utc)
          def iso(s):
              try: return dt.datetime.fromisoformat(str(s).replace("Z", "+00:00"))
              except Exception: return None
          def dec(p): return (100 / -p + 1) if p < 0 else (p / 100 + 1)
          def imp(p): return 1 / dec(p) if p else None


          def rows(pattern):
              for f in sorted(glob.glob(pattern)):
                  try:
                      for line in gzip.open(f, "rt"):
                          yield json.loads(line)
                  except Exception:
                      continue


          # ------------------------------------------------------------------ results
          def load_finals():
              """{(away_norm, home_norm, date): {...}} with first-half scores."""
              out = []
              for f in sorted(glob.glob(C("finals", "*.json"))):
                  try: d = json.load(open(f))
                  except Exception: continue
                  for v in d.values():
                      if v.get("h1a") is None or v.get("h1h") is None: continue
                      out.append(v)
              return out


          def match_final(gname, tip, finals):
              """FanDuel says 'La Salle @ Villanova'; ESPN says 'La Salle Explorers'. Match on
              both school names being prefixes of the ESPN names, same calendar day, unique hit."""
              if " @ " not in (gname or ""): return None
              a, h = (nm(x) for x in gname.split(" @ ", 1))
              if len(a) < 3 or len(h) < 3: return None
              day = (tip or "")[:10]
              hits = []
              for f in finals:
                  fd_ = (f.get("date") or "")[:10]
                  if fd_ and day and abs((dt.date.fromisoformat(fd_) - dt.date.fromisoformat(day)).days) > 1:
                      continue
                  fa, fh = nm(f.get("away")), nm(f.get("home"))
                  if fa.startswith(a) and fh.startswith(h): hits.append((f, False))
                  elif fa.startswith(h) and fh.startswith(a): hits.append((f, True))
              if len(hits) != 1: return None
              f, swap = hits[0]
              ot = bool(f.get("ot"))
              if swap:
                  return {"as": f["hs"], "hs": f["as"], "h1a": f["h1h"], "h1h": f["h1a"], "ot": ot}
              return {"as": f["as"], "hs": f["hs"], "h1a": f["h1a"], "h1h": f["h1h"], "ot": ot}


          def settle(fin, period, kind, side, line):
              if period == "1h":
                  a, h = fin["h1a"], fin["h1h"]
              else:                                   # 2nd half INCLUDING OT, which is what
                  a, h = fin["as"] - fin["h1a"], fin["hs"] - fin["h1h"]   # FanDuel settles
              if kind == "ml":
                  d = (h - a) if side == "home" else (a - h)
                  return "W" if d > 0 else ("L" if d < 0 else "P")
              if kind == "spread":
                  x = ((h - a) if side == "home" else (a - h)) + line
              elif kind == "tt_home":
                  x = (h - line) if side == "over" else (line - h)
              elif kind == "tt_away":
                  x = (a - line) if side == "over" else (line - a)
              else:
                  t = a + h
                  x = (t - line) if side == "over" else (line - t)
              return "W" if x > 0 else ("L" if x < 0 else "P")


          # ------------------------------------------------------------------ lines
          def load_fd():
              """(game, tip, market_id) -> {t: {side: (handicap, price)}}"""
              S = collections.defaultdict(dict)
              for r in rows(C("props", "*", "*.jsonl.gz")):
                  mk = FD_MT.get(r.get("mt"))
                  if not mk or r.get("s") != "ACTIVE" or r.get("h") is None: continue
                  per, kind = mk
                  g, tip, sel = r.get("g"), r.get("k"), (r.get("r") or "")
                  if not g or " @ " not in g: continue
                  if kind in ("total", "tt_home", "tt_away"):
                      side = "over" if "Over" in sel else ("under" if "Under" in sel else None)
                  else:
                      a, h = (nm(x) for x in g.split(" @ ", 1))
                      s_ = nm(sel)
                      side = "away" if s_ == a else ("home" if s_ == h else None)
                  if not side: continue
                  S[(g, tip, f"{per}|{kind}")].setdefault(r["t"], {})[side] = (r["h"], r.get("o"))
              return S


          def load_pin():
              """(pin game, market_id) -> {t: {'line':{}, 'price':{}, 'lim': n}} -- period 1 only."""
              S = collections.defaultdict(dict)
              for r in rows(C("pin", "*", "*.jsonl.gz")):
                  if r.get("per") != 1: continue
                  k = PIN_KIND.get(r.get("ty"))
                  if not k: continue
                  if k == "tt":
                      al = r.get("side") or r.get("d")
                      if al not in ("home", "away"): continue
                      mid = f"1h|tt_{al}"
                      dd = "over" if r.get("d") == "over" else ("under" if r.get("d") == "under" else None)
                      if dd is None: continue
                  else:
                      mid = f"1h|{k}"
                      dd = r.get("d")
                      if dd not in ("home", "away", "over", "under"): continue
                  e = S[(r["g"], mid)].setdefault(r["t"], {"line": {}, "price": {}, "lim": r.get("lim")})
                  e["line"][dd] = r.get("pr") if k == "ml" else r.get("pts")
                  e["price"][dd] = r.get("pr")
              return S


          def match_pin(gname, pin_games):
              """FanDuel 'La Salle @ Villanova' vs Pinnacle 'La Salle @ Villanova Wildcats'."""
              if " @ " not in (gname or ""): return None
              a, h = (nm(x) for x in gname.split(" @ ", 1))
              best = None
              for pg in pin_games:
                  if " @ " not in pg: continue
                  pa, ph = (nm(x) for x in pg.split(" @ ", 1))
                  if len(pa) < 3 or len(ph) < 3: continue
                  if (pa.startswith(a) or a.startswith(pa)) and (ph.startswith(h) or h.startswith(ph)):
                      sc = len(pa) + len(ph)
                      if best is None or sc > best[0]: best = (sc, pg)
              return best[1] if best else None


          # ------------------------------------------------------------------ read
          def at(d, t):
              ks = [k for k in d if k <= t]
              return d[max(ks)] if ks else None


          def read(fdser, pinser, mid, t):
              kind = mid.split("|")[1]
              s0, s1 = KIND["tt" if kind.startswith("tt_") else kind]
              f = at(fdser, t)
              if not f or s0 not in f or s1 not in f: return None
              f0 = fdser[min(fdser)]
              if s0 not in f0 or s1 not in f0: f0 = f
              ml = kind == "ml"
              r = {"t": t,
                   "line": {s0: (f[s0][1] if ml else f[s0][0]), s1: (f[s1][1] if ml else f[s1][0])},
                   "odds": {s0: f[s0][1], s1: f[s1][1]},
                   "open": (f0[s0][1] if ml else f0[s0][0]), "calls": {}}

              cur, op = r["line"][s0], r["open"]
              if cur is not None and op is not None and cur != op:
                  if ml:
                      i1, i0 = imp(cur), imp(op)
                      if i1 and i0 and i1 != i0: r["calls"]["follow_move"] = s0 if i1 > i0 else s1
                  elif kind == "spread":
                      r["calls"]["follow_move"] = s1 if cur > op else s0
                  else:
                      r["calls"]["follow_move"] = s0 if cur > op else s1
                  r["move"] = round(cur - op, 1) if not ml else None
              elif not ml and None not in (f[s0][1], f[s1][1], f0[s0][1], f0[s1][1]):
                  d0, d1 = f[s0][1] - f0[s0][1], f[s1][1] - f0[s1][1]
                  if max(abs(d0), abs(d1)) >= JUICE_C and (d0 < 0) != (d1 < 0):
                      r["calls"]["fd_juice"] = s0 if d0 < d1 else s1

              p = at(pinser, t) if pinser else None
              if p and p["line"].get(s0) is not None:
                  r["pin"], r["pin_lim"] = p["line"][s0], p.get("lim")
                  po, pu = imp(p["price"].get(s0)), imp(p["price"].get(s1))
                  if po and pu:
                      fair0 = po / (po + pu)
                      if ml or p["line"][s0] == r["line"][s0]:
                          e0 = fair0 * dec(r["odds"][s0]) - 1 if r["odds"][s0] else -9
                          e1 = (1 - fair0) * dec(r["odds"][s1]) - 1 if r["odds"][s1] else -9
                          if max(e0, e1) > 0:
                              r["calls"]["pin_price"] = s0 if e0 > e1 else s1
                              r["edge_pct"] = round(100 * max(e0, e1), 2)
                  if not ml and p["line"][s0] != r["line"][s0]:
                      r["pin_gap"] = round(r["line"][s0] - p["line"][s0], 1)
                      if kind == "spread":
                          r["calls"]["pin_value"] = s0 if r["line"][s0] > p["line"][s0] else s1
                      else:
                          r["calls"]["pin_value"] = s1 if r["line"][s0] > p["line"][s0] else s0
              return r


          def profit(odds, res):
              if res == "P" or odds is None: return 0.0
              return -1.0 if res == "L" else (100.0 / -odds if odds < 0 else odds / 100.0)


          def clv(kind, side, a, b):
              if a is None or b is None: return None
              if kind == "ml":
                  x, y = imp(a), imp(b)
                  return round(100 * (y - x), 1) if (x is not None and y is not None) else None
              if kind == "spread": return round(a - b, 1)
              return round((b - a) if side == "over" else (a - b), 1)


          def default_side(kind, side, r):
              if kind in ("total", "tt_home", "tt_away"): return side == "over"
              a, b = r["line"].get("home"), r["line"].get("away")
              if a is None or b is None: return None
              if kind == "ml": return side == ("home" if a < b else "away")
              return side == ("home" if a < 0 else "away")


          # ------------------------------------------------------------------ build
          def build():
              finals, FD, PIN = load_finals(), load_fd(), load_pin()
              pin_games = sorted({g for g, _ in PIN})
              pmap = {}
              now = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H%MZ")
              graded, live, nomatch = [], [], 0
              for (g, tip, mid), ser in FD.items():
                  ko = iso(tip)
                  if not ko or not ser: continue
                  kots = ko.strftime("%Y-%m-%dT%H%MZ")
                  per, kind = mid.split("|")
                  if g not in pmap: pmap[g] = match_pin(g, pin_games)
                  pinser = PIN.get((pmap[g], mid), {}) if pmap[g] else {}
                  base = {"game": g, "market": mid, "period": per, "kind": kind, "tip": tip}
                  if kots > now:
                      r = read(ser, pinser, mid, now)
                      if r and r["calls"]: live.append(dict(base, now=r))
                      continue
                  fin = match_final(g, tip, finals)
                  if not fin:
                      nomatch += 1; continue
                  f0 = min(ser)
                  e_t = (T(f0) + dt.timedelta(minutes=EARLY_MIN)).strftime("%Y-%m-%dT%H%MZ")
                  last = (ko - dt.timedelta(minutes=1)).strftime("%Y-%m-%dT%H%MZ")
                  cl = read(ser, pinser, mid, last)
                  if not cl: continue
                  ea = read(ser, pinser, mid, e_t) if e_t < kots else None
                  dflt = next((sd for sd in KIND["tt" if kind.startswith("tt_") else kind]
                               if default_side(kind, sd, cl) is True), None)
                  rec = dict(base, ot=fin.get("ot", False), markets={"close": cl})
                  if dflt is not None and cl["line"].get(dflt) is not None:
                      rec["default_res"] = settle(fin, per, kind, dflt, cl["line"][dflt])
                  if ea: rec["markets"]["early"] = ea
                  for cp, r in (("early", ea), ("close", cl)):
                      if not r: continue
                      gr = {}
                      for sig, side in r["calls"].items():
                          res = settle(fin, per, kind, side, r["line"][side])
                          gr[sig] = {"side": side, "line": r["line"][side], "odds": r["odds"][side],
                                     "res": res, "units": round(profit(r["odds"][side], res), 3),
                                     "took_default": default_side(kind, side, r)}
                          if cp == "early":
                              gr[sig]["clv"] = clv(kind, side, r["line"][side], cl["line"][side])
                      rec[cp + "_graded"] = gr
                  if rec.get("close_graded"): graded.append(rec)
              graded.sort(key=lambda r: r["tip"]); live.sort(key=lambda r: r["tip"])
              return graded, live, nomatch


          def base_rates(graded):
              """How often the default side (favourite / over) won, over EVERY graded market.

              This must not be conditioned on what the signals did. An earlier version tallied only
              markets where some signal happened to fire AND take the default side, and counted a
              market once per signal -- so the baseline moved with signal behaviour and every
              `edge_pts` in the scorecard was measured against it.
              """
              out = {}
              for kind in ("spread", "total", "ml", "tt_home", "tt_away"):
                  w = n = 0
                  for g in graded:
                      if g["kind"] != kind: continue
                      r = g.get("default_res")
                      if r in ("W", "L"): n += 1; w += (r == "W")
                  out[kind] = {"rate": (w / n) if n else 0.5, "n": n}
              # second-half team totals settle including overtime, and an OT game adds a whole
              # scoring period the line never accounted for. Measured 2026-11-12: overs went
              # 10-1 (90.9%) in OT games against 124-97 (56.1%) without. Reporting them together
              # overstates the bias, so they are reported apart.
              for lab, want in (("2h_tt_ot", True), ("2h_tt_no_ot", False)):
                  w = n = 0
                  for g in graded:
                      if g["period"] != "2h" or not g["kind"].startswith("tt_"): continue
                      if bool(g.get("ot")) != want: continue
                      r = g.get("default_res")
                      if r in ("W", "L"): n += 1; w += (r == "W")
                  out[lab] = {"rate": (w / n) if n else 0.5, "n": n}
              return out


          def summarize(graded, br):
              def blank(): return {"n": 0, "W": 0, "L": 0, "P": 0, "units": 0.0, "clv": [],
                                   "dec": 0, "exp": 0.0, "dflt": 0}
              S = collections.defaultdict(blank)
              for g in graded:
                  rate = br[g["kind"]]["rate"]
                  for cp in ("early", "close"):
                      for sig, x in (g.get(cp + "_graded") or {}).items():
                          tags = ["all", g["period"], f"{g['period']}|{g['kind']}"]
                          if g["period"] == "2h":
                              tags.append("2h OT game" if g.get("ot") else "2h no OT")
                          for tag in tags:
                              s = S[(sig, cp, tag)]
                              s["n"] += 1; s[x["res"]] += 1; s["units"] += x["units"]
                              if x.get("clv") is not None: s["clv"].append(x["clv"])
                              if x["res"] != "P" and x.get("took_default") is not None:
                                  s["dec"] += 1; s["dflt"] += bool(x["took_default"])
                                  s["exp"] += rate if x["took_default"] else (1 - rate)
              out = []
              for (sig, cp, tag), s in S.items():
                  d = s["W"] + s["L"]
                  hit = s["W"] / d if d else None
                  z = (s["W"] - d * BREAKEVEN) / math.sqrt(d * 0.25) if d else None
                  row = {"signal": sig, "checkpoint": cp, "slice": tag, "n": s["n"], "W": s["W"],
                         "L": s["L"], "P": s["P"],
                         "hit_pct": round(100 * hit, 1) if hit is not None else None,
                         "units": round(s["units"], 2),
                         "roi_pct": round(100 * s["units"] / s["n"], 1) if s["n"] else None,
                         "z_vs_breakeven": round(z, 2) if z is not None else None}
                  if s["dec"]:
                      exp = 100 * s["exp"] / s["dec"]
                      row["picked_default_pct"] = round(100 * s["dflt"] / s["dec"], 1)
                      row["expected_pct"] = round(exp, 1)
                      row["edge_pts"] = round(100 * s["W"] / d - exp, 1) if d else None
                  if s["clv"]: row["clv_avg"] = round(sum(s["clv"]) / len(s["clv"]), 2)
                  e = row.get("edge_pts")
                  row["proposal"] = (
                      f"keep collecting ({d}/{MIN_N})" if d < MIN_N else
                      "PROMOTE: beats break-even and its own base rate" if z >= 1.5 and (e or 0) >= 5 else
                      "beats break-even but not its base rate -- directional bias, not signal"
                      if z >= 1.5 else
                      "INVERT candidate: wrong well beyond its base rate" if (e or 0) <= -15 else
                      "DROP: below break-even" if z <= -1.5 else "no edge shown yet")
                  out.append(row)
              order = {s: i for i, s in enumerate(SIGNALS)}
              out.sort(key=lambda r: (r["slice"] != "all", r["checkpoint"],
                                      order.get(r["signal"], 9), r["slice"]))
              return out


          def rec_str(r): return f"{r['W']}-{r['L']}" + (f"-{r['P']}" if r["P"] else "")


          def scorecard_md(summary, graded, br, nomatch, gen):
              L = ["# CBB period scorecard — halves and half team totals", "",
                   f"Generated {gen}. {len(graded)} graded period markets "
                   f"({nomatch} had no unique final matched and are not graded).", "",
                   "Retail lines from the FanDuel event feed, sharp reference from Pinnacle at",
                   "period 1. Second-half markets settle **including overtime**, which is how",
                   "FanDuel grades them, and the finals file carries `h1a`/`h1h` so the second half",
                   "is simply final minus first half.", "",
                   "**There are no tickets/money splits on any period market** — the Action Network",
                   "splits feed is full-game only — so every signal here is handicap or price.",
                   "Pinnacle covers the first half only, so 2nd-half markets run on FanDuel's own",
                   "movement alone.", "",
                   "Base rates on this sample:", ""]
              for k, v in br.items():
                  L.append(f"- **{k}**: default side won {100*v['rate']:.1f}% (n={v['n']})")
              L += ["", f"Proposals appear at {MIN_N} decided markets. Nothing changes automatically.", ""]
              for cp in ("early", "close"):
                  L += [f"## {cp.upper()}", "",
                        "| signal | record | hit % | expected % | edge | units | ROI % | CLV avg | status |",
                        "|---|---|---|---|---|---|---|---|---|"]
                  for r in summary:
                      if r["slice"] != "all" or r["checkpoint"] != cp: continue
                      L.append(f"| {r['signal']} | {rec_str(r)} | {r['hit_pct']} | "
                               f"{r.get('expected_pct','')} | {r.get('edge_pts','')} | {r['units']:+} | "
                               f"{r['roi_pct']} | {r.get('clv_avg','')} | {r['proposal']} |")
                  L.append("")
              L += ["## By period and market", "",
                    "| signal | checkpoint | slice | record | hit % | edge | ROI % |",
                    "|---|---|---|---|---|---|---|"]
              for r in summary:
                  if r["slice"] == "all": continue
                  L.append(f"| {r['signal']} | {r['checkpoint']} | {r['slice']} | {rec_str(r)} | "
                           f"{r['hit_pct']} | {r.get('edge_pts','')} | {r['roi_pct']} |")
              return "\n".join(L) + "\n"


          def board_md(live, summary, gen):
              rec = {r["signal"]: r for r in summary if r["slice"] == "all" and r["checkpoint"] == "close"}
              L = ["# CBB period board", "",
                   f"Generated {gen}. Live halves and half team totals where a signal has an",
                   "opinion. Each call shows that signal's graded record so far.", "",
                   "No splits exist for any of these markets. This is analysis, not picks.", ""]
              groups = collections.defaultdict(list)
              for x in live:
                  r = x["now"]
                  t = collections.Counter(r["calls"].values())
                  side, n = t.most_common(1)[0]
                  groups[(n, len(r["calls"]) - n)].append((x, r, side))
              for k in sorted(groups, key=lambda k: (-k[0], k[1])):
                  L += [f"## {k[0]} signal{'s' if k[0] != 1 else ''} agree, {k[1]} against", "",
                        "| tip (ET) | game | market | lean | FD | open | Pin | gap | price | calls |",
                        "|---|---|---|---|---|---|---|---|---|---|"]
                  for x, r, side in sorted(groups[k], key=lambda y: (y[0]["tip"], y[0]["market"])):
                      tp = iso(x["tip"])
                      tt = (tp - dt.timedelta(hours=5)).strftime("%a %H:%M") if tp else ""
                      parts = [f"{s}->{sd} ({rec_str(rec[s]) if s in rec else '0-0'})"
                               for s, sd in r["calls"].items()]
                      L.append(f"| {tt} | {x['game']} | {x['market']} | {side} | "
                               f"{r['line'][side] if r['line'][side] is not None else ''} | "
                               f"{r.get('open','')} | {r.get('pin','')} | {r.get('pin_gap','')} | "
                               f"{r['odds'][side] if r['odds'][side] is not None else ''} | "
                               f"{'; '.join(parts)} |")
                  L.append("")
              if not groups: L.append("No live period markets with a signal yet.")
              return "\n".join(L) + "\n"


          if __name__ == "__main__":
              graded, live, nomatch = build()
              br = base_rates(graded)
              summary = summarize(graded, br)
              gen = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              os.makedirs(C("graded"), exist_ok=True)
              json.dump(graded, open(C("graded", "periods.json"), "w"), indent=1)
              json.dump({"generated": gen, "graded": len(graded), "unmatched_finals": nomatch,
                         "base_rates": br, "min_n_to_propose": MIN_N, "signals": summary},
                        open(C("graded", "periods_summary.json"), "w"), indent=1)
              open(C("PERIODS_SCORECARD.md"), "w").write(scorecard_md(summary, graded, br, nomatch, gen))
              open(C("PERIODS_BOARD.md"), "w").write(board_md(live, summary, gen))
              print(f"graded CBB period markets: {len(graded)}   live: {len(live)}   "
                    f"no final matched: {nomatch}")
              print("base rates: " + "  ".join(
                  f"{k} {100*v['rate']:.1f}% (n={v['n']})" for k, v in br.items()))
              for r in summary:
                  if r["slice"] == "all":
                      print(f"  {r['checkpoint']:5} {r['signal']:11} {rec_str(r):>10}  hit {r['hit_pct']}"
                            f"  exp {r.get('expected_pct')}  edge {r.get('edge_pts')}"
                            f"  roi {r['roi_pct']}  {r['proposal']}")
          PY

      - name: Commit
        run: |
          git config user.name  "propwatch-bot"
          git config user.email "propwatch-bot@users.noreply.github.com"
          git add cbb/graded cbb/PERIODS_SCORECARD.md cbb/PERIODS_BOARD.md
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -q -m "cbb periods $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase --autostash && git push -q && exit 0
            sleep 9
          done
          exit 1
