name: grade-cbb
# College basketball grader. Every 3 hours it rebuilds, from the collector's archive:
#   cbb/SCORECARD.md         each signal's record, ROI and closing-line value
#   cbb/BOARD.md             upcoming games and what each signal says, beside its record
#   cbb/graded/games.json    every graded game with the system's read at EARLY and CLOSE
#   cbb/graded/summary.json  the scorecard as data
# It never changes its own rules. Proposals appear on the scorecard once a signal has
# 30 graded games; a person approves any change.
on:
  schedule:
    - cron: "49 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grade-cbb
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: grade and build board
        run: |
          python3 - . <<'PY'


          #!/usr/bin/env python3
          """Propwatch CBB grader + board. Stdlib only. Runs on a GitHub Actions runner.

          Every run it rebuilds, from the collector's archive:

            cbb/graded/games.json      every finished game: the system's read at two checkpoints
                                       (EARLY = first hour after the line was first seen, CLOSE =
                                       last number before tip) and how each signal did.
            cbb/graded/summary.json    each signal's record: W-L, hit %, ROI at the actual price,
                                       closing-line value, split by market depth.
            cbb/SCORECARD.md           the same, readable on GitHub.
            cbb/BOARD.md               upcoming games: what each signal says now, next to that
                                       signal's graded record so far.

          Nothing here is a bet. It grades what every signal said on every game, so the record
          is complete and unbiased whether or not anyone bet. It never changes its own rules:
          it reports which signals are earning and proposes changes once a signal has
          MIN_N graded games. A person approves the change.

          Reads are built only from rows timestamped BEFORE tip, so history has no look-ahead.

          Signals (each picks a side of the spread or the total):
            follow_move   the side the line has moved toward since the opener (AN book 30)
            money_level   the side with the larger share of money
            sharp_gap     the side whose money% most exceeds its tickets%
            money_moving  the side whose money% rose faster than its tickets% since first seen
            pin_value     the side FanDuel prices better than Pinnacle (Pinnacle = fair value)
          """
          import gzip, itertools, json, os, sys, glob, math, collections, datetime as dt

          REPO = sys.argv[1] if len(sys.argv) > 1 else "."
          C = lambda *a: os.path.join(REPO, "cbb", *a)
          FD, OPEN = "69", "30"
          EARLY_MIN = 60
          MIN_N = 30
          SHRINK_K = 25         # a signal's edge is shrunk toward zero by n/(n+K)
          BREAKEVEN = 0.524            # -110
          SIGNALS = ("rlm_quiet", "pin_move", "money_delta", "pin_rlm", "pre_move", "follow_move", "rlm_ratio", "money_level",
                     "sharp_gap", "money_moving", "pin_value", "book_lag", "consensus_gap")
          # rlm_ratio is a conjunction, not a single variable. Measured on 1,862 CBB
          # side-observations: a minority-ticket side wins 42.9% alone, and 37.6% if you add a high
          # money/ticket ratio WITHOUT line confirmation -- "few tickets, big money" is a LOSING
          # pattern by itself. Require the line to have moved toward it anyway and the same
          # population goes to 52.7%, a ~14 point swing. The ratio means nothing until the number
          # moves against the crowd to confirm it.
          RLM_TIX_MAX = 45      # that side holds under this share of tickets
          RLM_RATIO_MIN = 1.2   # its money share is at least this multiple of its ticket share
          RLM_MNY_MAX = 45      # rlm_quiet: ...and under this share of money too
          # ---------------------------------------------------------------------------
          # CHANGES, NOT STATES. Measured 2026-11-19 across 2,950 CBB markets where some
          # signal fired, every state variable came back flat and every derivative carried
          # information:
          #   money LEVEL (peak >=95% of handle) ... 53.4%, a coin flip
          #   money RISING (into a <50% ticket side) 57.1%, n=399
          #   Pinnacle's POSITION vs FanDuel ....... no order at all across five buckets:
          #                                          >=+1.0 pt -5.2%, same -3.5%, <=-1.0 -1.8%
          #   Pinnacle MOVING ...................... orders outcomes at every level of
          #                                          what FanDuel did
          #   line UNMOVED ......................... -9.4%
          #   line ALREADY MOVED 2+ pts ............ -2.3%
          # The engine was built almost entirely on states -- money_level, sharp_gap and
          # pin_value all read a snapshot at a checkpoint, and the one change-based signal,
          # follow_move, reads FANDUEL's change, the book whose direction does not matter.
          # These two signals read the changes that do.
          PIN_MOVE_MIN = 0.5    # points Pinnacle's own number must have travelled
          MONEY_DELTA_MIN = 5   # points of money share a side must have GAINED
          MONEY_DELTA_TIX_MAX = 50   # ...while still holding under this share of tickets
          # ---------------------------------------------------------------------------
          # pre_move is rlm_ratio's mirror image and the system's stated goal stated as a signal:
          # the money is on the minority-ticket side at an outsized ratio and the number has NOT
          # moved yet. rlm_ratio pays you for recognising a move that already happened; pre_move
          # claims the move is still coming. It is the harder and more valuable claim, and until
          # now it has only ever been eyeballed into a card by hand -- never graded. CLV is the
          # direct test of it: if the thesis is right, the number should come to you.
          PUBLIC_MIN = 60       # ticket share that makes a side "the public side"
          # pin_rlm is the strongest form of the same idea: PINNACLE moved its number toward the
          # side the public is NOT on, with the splits confirming. rlm_ratio reads FanDuel's own
          # number moving -- a retail book reacting to its own flow. This reads the sharp book
          # repricing against the crowd.
          LAG_BOOKS = 4        # books that must have moved before FanDuel counts as stale
          NB_BUCKETS = ((0, 1000, "<1k bets"), (1000, 3000, "1-3k bets"), (3000, 10**9, "3k+ bets"))
          LIM_BUCKETS = ((0, 1000, "pin limit <$1k"), (1000, 2000, "pin $1-2k"), (2000, 10**9, "pin $2k+"))


          def now_utc(): return dt.datetime.now(dt.timezone.utc)
          def tsfmt(t): return t.strftime("%Y-%m-%dT%H%MZ")
          def parse_ts(s): return dt.datetime.strptime(s, "%Y-%m-%dT%H%MZ").replace(tzinfo=dt.timezone.utc)
          def iso_to_ts(s): return s[:13] + s[14:16] + "Z"          # 2026-11-04T00:00:00.000Z -> ...T0000Z
          def jload(p, d):
              try: return json.load(open(p))
              except Exception: return d


          def rows(pattern):
              for f in sorted(glob.glob(pattern)):
                  try:
                      for line in gzip.open(f, "rt"):
                          yield json.loads(line)
                  except Exception:
                      continue


          # ------------------------------------------------------------------ load

          def dedupe_series(ser):
              """One FanDuel quote per (game, market, side, timestamp).

              Action Network returns SEVERAL rows for the same game, market and side at one
              instant: the main line, which carries bet_info, plus alternate or stale quotes
              that read tix=0/mny=0 and sometimes sit four or more points away. The grader
              appended them all and sorted by time, so `at(A, t)` -- "the line at time t" --
              could return either one.

              Measured 2026-11-21 across 802 CBB totals: the graded CLOSE landed on one of
              these alternates in 15.3% of markets. The close is the number every signal is
              computed from, so a wrong close means a wrong follow_move, a wrong pin_value
              gap, wrong CLV and a wrong base rate -- the same class of defect as the
              moneyline opener reading index 0, where the signals were fine and the number
              underneath them was not.

              The main line is the one carrying splits. Before any bets exist every row reads
              zero, so the fallback is the value that ALSO appears on the opposite side at
              that instant: a total's over and under quote the same number and a spread's two
              sides are negatives of each other, so a one-sided alternate exposes itself by
              having no partner. Moneylines get no partner test -- the two sides carry
              unrelated prices -- so they fall through to the first row, which is the old
              behaviour. Last resort everywhere is the first row, so this can only ever
              narrow a choice, never invent one.

              NOT a signal change: no threshold or definition moves, so the holdout does not
              reset. It IS retroactive, like the moneyline fix -- records computed against a
              corrected close will shift."""
              opp_of = {"home": "away", "away": "home", "over": "under", "under": "over"}
              vals_at = {}
              for (gid, mkt, side), rws in ser.items():
                  d = {}
                  for x in rws:
                      if x[1] is not None: d.setdefault(x[0], set()).add(x[1])
                  vals_at[(gid, mkt, side)] = d
              for key in list(ser):
                  gid, mkt, side = key
                  byt = {}
                  for x in ser[key]: byt.setdefault(x[0], []).append(x)
                  if all(len(v) == 1 for v in byt.values()): continue
                  opp = vals_at.get((gid, mkt, opp_of.get(side, side)), {})
                  out = []
                  for t in sorted(byt):
                      c = byt[t]
                      if len(c) == 1: out.append(c[0]); continue
                      real = [x for x in c if x[1] is not None] or c
                      split = [x for x in real if (x[3] or 0) > 0 or (x[4] or 0) > 0]
                      if split: out.append(split[0]); continue
                      if mkt in ("spread", "total"):
                          seen = opp.get(t, ())
                          match = [x for x in real
                                   if (-x[1] if mkt == "spread" else x[1]) in seen]
                          if match: out.append(match[0]); continue
                      out.append(real[0])
                  ser[key] = out
              return ser


          _SEEN = set()


          def load():
              teams = jload(C("state", "teams.json"), {})
              openers = {}
              for f in sorted(glob.glob(C("openers", "*.json"))):
                  openers.update(jload(f, {}).get("an", {}))
              openers.update(jload(C("state", "collector.json"), {}).get("openers", {}).get("an", {}))

              ser = collections.defaultdict(list)           # (gid, mkt, side) -> [(t, v, o, tx, mn, nb)]
              # Every OTHER book's number, for consensus and lag. CBB already collects 7 books
              # (69, 30, 15, 49, 68, 71, 75) and the grader only ever read FanDuel.
              bk = collections.defaultdict(lambda: collections.defaultdict(dict))  # (gid,mkt)->t->book->v
              games = {}
              for r in rows(C("splits", "*", "*.jsonl.gz")):
                  _SEEN.update(r.keys())
                  if r.get("m") not in MARKETS: continue
                  # Action Network labels its live in-game quote and its alternate lines; the
                  # collector now records both flags (2026-11-21). Rows written before that date
                  # carry neither, so absence means "unknown, keep" and the dedupe below still
                  # does the work for the historical archive. Once the archive has rolled over,
                  # these two lines are the whole fix and the heuristic can go.
                  if r.get("lv") is True or r.get("alt") is True: continue
                  if r.get("per") not in (None, "event"): continue
                  if r.get("b") != FD:
                      if r.get("sd") == ("over" if r["m"] == "total" else "home"):
                          v = r.get("o") if r["m"] == "moneyline" else r.get("v")
                          if v is not None: bk[(str(r["gid"]), r["m"])][r["t"]][r["b"]] = v
                      continue
                  gid = str(r["gid"])
                  # a moneyline has no handicap -- its price IS its line
                  val = r.get("o") if r["m"] == "moneyline" else r.get("v")
                  ser[(gid, r["m"], r["sd"])].append((r["t"], val, r.get("o"), r.get("tx"),
                                                      r.get("mn"), r.get("nb")))
                  g = games.setdefault(gid, {"gid": gid, "g": r["g"], "tip": r["st"], "ac": r.get("ac"),
                                             "hc": r.get("hc")})
                  if r["m"] == "spread" and r.get("tid") is not None:
                      g[r["sd"] + "_name"] = (teams.get(str(r["tid"])) or {}).get("name")
              # Everything this grader reads out of a splits row. Anything the collector writes
              # that is NOT in here is reported as unused on every run -- that list is how
              # is_live, is_alt_market and the rotation numbers become visible without anyone
              # thinking to look for them.
              _CONSUMED = {"t","gid","g","st","ss","nb","ac","hc","b","m","sd","tid","v","o",
                           "tx","mn","lv","alt","per","ls"}
              _cov = field_coverage(_SEEN, _CONSUMED, "action_network_splits")
              print(f"  field coverage [{_cov['source']}]: {_cov['n_consumed']}/{_cov['n_seen']} consumed", flush=True)
              if _cov["unused"]:
                  print(f"  !! UNUSED FIELDS IN THE DATA: {', '.join(_cov['unused'])}", flush=True)
                  print(f"     Each is something the system could use and does not.", flush=True)

              for v in ser.values(): v.sort()
              dedupe_series(ser)

              pin = collections.defaultdict(list)           # (pin game, kickoff) -> rows
              for r in rows(C("pin", "*", "*.jsonl.gz")):
                  if r.get("per") != 0 or r.get("ty") not in MARKETS: continue
                  pts = r.get("pr") if r["ty"] == "moneyline" else r.get("pts")
                  pin[(r["g"], r["k"])].append((r["t"], r["ty"], r["d"], pts, r.get("lim"), r.get("pr")))
              for v in pin.values(): v.sort()

              finals = []
              for f in sorted(glob.glob(C("finals", "*.json"))):
                  finals += list(jload(f, {}).values())
              return games, ser, openers, pin, finals, bk


          # ------------------------------------------------------------------ joins
          def norm(s): return "".join(ch for ch in (s or "").lower() if ch.isalnum())


          def toks(s):
              out, cur = [], ""
              for ch in (s or "").lower():
                  if ch.isalnum(): cur += ch
                  elif cur: out.append(cur); cur = ""
              if cur: out.append(cur)
              return out


          def name_match(an, pn):
              """Does Pinnacle's school name `pn` denote Action Network's full name `an`?

              Pass 1 is the original test: Pinnacle's name is a prefix of AN's, which covers
              the mascot case ('Kentucky' vs 'Kentucky Wildcats').

              Pass 2 handles the abbreviation class found 2026-11-20 on NCST@HALL, a game
              with 4,791 bets that reached the board with no Pinnacle price at all. Pinnacle
              writes 'NC State' where AN writes 'North Carolina State Wolfpack' -- no prefix
              relationship exists in either direction, so pass 1 cannot see it. Here a short
              leading token (2-4 letters) is expanded as an initialism against AN's leading
              words ('nc' -> north, carolina), and Pinnacle's REMAINING tokens must then
              prefix-match AN's remaining tokens in order.

              That ordering constraint is what keeps it safe. 'NC State' matches 'North
              Carolina State Wolfpack' but NOT 'North Carolina Tar Heels', because after
              'nc' consumes 'north carolina' the token 'state' has nothing to match. This is
              the same trap the docs record from the first matcher fix, where a naive
              loosening made *Michigan* match *Michigan State*."""
              a, p = norm(an), norm(pn)
              if len(p) >= 4 and a.startswith(p): return True
              A, P = toks(an), toks(pn)
              if not A or not P: return False
              head = P[0]
              if not (2 <= len(head) <= 4) or len(A) < len(head): return False
              if any(A[i][0] != head[i] for i in range(len(head))): return False
              rest_a, rest_p = A[len(head):], P[1:]
              if not rest_p or len(rest_p) > len(rest_a): return False
              return all(rest_a[i].startswith(rest_p[i]) for i in range(len(rest_p)))


          def match_final(g, finals):
              a, h = g.get("away_name"), g.get("home_name")
              if not a or not h: return None
              tip = g["tip"][:10]
              near = [f for f in finals
                      if abs((dt.date.fromisoformat(f["date"][:10]) - dt.date.fromisoformat(tip)).days) <= 1]
              for f in near:
                  if f["away"] == a and f["home"] == h:
                      return {"as": f["as"], "hs": f["hs"]}
                  if f["away"] == h and f["home"] == a:            # neutral site listed the other way
                      return {"as": f["hs"], "hs": f["as"]}
              # Fallback: ESPN and Action Network spell some schools differently ("SMU Mustangs" vs
              # "Southern Methodist Mustangs"). Match on BOTH mascots, accept only a unique hit.
              ma, mh = a.split()[-1].lower(), h.split()[-1].lower()
              hits = [(f, False) for f in near if f["away"].split()[-1].lower() == ma
                      and f["home"].split()[-1].lower() == mh]
              hits += [(f, True) for f in near if f["away"].split()[-1].lower() == mh
                       and f["home"].split()[-1].lower() == ma]
              if len(hits) == 1:
                  f, swap = hits[0]
                  return {"as": f["hs"], "hs": f["as"]} if swap else {"as": f["as"], "hs": f["hs"]}
              return None


          def match_pin(g, pin_keys):
              """Pinnacle uses school names without mascots ('Kentucky' vs 'Kentucky Wildcats').
              Match when both school names are prefixes of AN's full names and tip is within 90 min.

              Neutral-site games (MTEs, conference tournaments, the Thanksgiving-week fields)
              have no real home team, so AN and Pinnacle pick an orientation independently and
              disagree about half the time. Requiring orientation to agree declined those games
              outright: neutral games matched at 69.6% against 83.0% for true home/away, and a
              declined match means no Pinnacle price reaches the board at all -- pin_value,
              pin_rlm and pin_move all go silent on exactly the games Justin most wants them on.

              So try the reversed orientation too, and report it with swap=True. A forward match
              is always preferred, and the reversed pass only runs when the forward one finds
              nothing, so a real home/away game cannot be silently flipped. The caller relabels
              Pinnacle's home/away rows rather than threading the flag into read().

              Returns (name, key, swap) or None."""
              aw, hm = g.get("away_name"), g.get("home_name")
              if not aw or not hm: return None
              tip = dt.datetime.fromisoformat(g["tip"].replace("Z", "+00:00"))
              cand = []
              for name, k in pin_keys:
                  try: pk = dt.datetime.fromisoformat(str(k).replace("Z", "+00:00"))
                  except Exception: continue
                  if abs((pk - tip).total_seconds()) > 5400: continue
                  parts = name.split(" @ ")
                  if len(parts) != 2: continue
                  pa, ph = parts[0], parts[1]
                  if len(norm(pa)) < 4 or len(norm(ph)) < 4: continue
                  cand.append((name, k, pa, ph))
              for swap in (False, True):
                  hits = []
                  for name, k, pa, ph in cand:
                      x, y = (ph, pa) if swap else (pa, ph)
                      if name_match(aw, x) and name_match(hm, y):
                          hits.append((len(norm(pa)) + len(norm(ph)), name, k))
                  if not hits: continue
                  # One matchup can appear under several snapshot keys, so hits sharing a NAME
                  # are the same game, not competing candidates -- collapse them and keep the
                  # key nearest tip. Only genuinely different names are ambiguous, and there a
                  # tie is a decline rather than a coin flip: a wrong Pinnacle price is worse
                  # than none, because it reaches the board looking exactly like a right one.
                  names = {h[1] for h in hits}
                  if len(names) > 1:
                      best = sorted(hits, reverse=True)
                      if best[0][0] == best[1][0]: return None
                      hits = [h for h in hits if h[1] == best[0][1]]
                  pick = min(hits, key=lambda h: abs(
                      (dt.datetime.fromisoformat(str(h[2]).replace("Z", "+00:00")) - tip).total_seconds()))
                  return (pick[1], pick[2], swap)
              return None


          def swap_sides(prow):
              """Relabel Pinnacle's home/away rows for a reversed-orientation match.

              The handicap and the price travel with the team, not with the label, so this is a
              pure relabel -- no negation. Totals carry no orientation and pass through."""
              flip = {"home": "away", "away": "home"}
              return [(row[0], row[1], flip.get(row[2], row[2])) + tuple(row[3:]) for row in prow]


          # ------------------------------------------------------------------ reads
          def at(series, t):
              """last row at or before t (series sorted), else None"""
              out = None
              for row in series:
                  if row[0] <= t: out = row
                  else: break
              return out


          def pin_at(prow, ty, desig, t):
              out = None
              for row in prow:
                  if row[0] > t: break
                  if row[1] == ty and row[2] == desig: out = row
              return out


          SIDES = {"spread": ("home", "away"), "total": ("over", "under"),
                   "moneyline": ("home", "away")}
          MARKETS = ("spread", "total", "moneyline")


          def dec(p): return (100 / -p + 1) if p < 0 else (p / 100 + 1)
          def imp(p): return 1 / dec(p) if p else None


          def book_read(books, mkt, t, fd_line, fd_open, s0, s1):
              """Consensus and lag across the other books. No splits involved.

              consensus_gap  FanDuel is off the book median -- take the side FanDuel gives away.
              book_lag       at least LAG_BOOKS of them have moved off their own first-seen number
                             one way and FanDuel has not. FanDuel is stale and about to follow.
              """
              if not books: return {}, {}
              ks = [k for k in books if k <= t]
              if not ks: return {}, {}
              snap = books[max(ks)]
              first = books[min(books)]
              vals = sorted(v for v in snap.values() if v is not None)
              if len(vals) < 3: return {}, {}
              med = (vals[len(vals)//2] if len(vals) % 2
                     else (vals[len(vals)//2 - 1] + vals[len(vals)//2]) / 2)
              calls, info = {}, {"books": len(vals), "median": med}
              if fd_line is not None and fd_line != med:
                  if mkt == "spread":    calls["consensus_gap"] = s0 if fd_line > med else s1
                  elif mkt == "total":   calls["consensus_gap"] = s1 if fd_line > med else s0
                  else:
                      a, b = imp(fd_line), imp(med)
                      if a and b: calls["consensus_gap"] = s1 if a > b else s0
              up = dn = 0
              for b_, v in snap.items():
                  o = first.get(b_)
                  if v is None or o is None or v == o: continue
                  up += v > o; dn += v < o
              info["books_up"], info["books_dn"] = up, dn
              moved = fd_line is not None and fd_open is not None and fd_line != fd_open
              if not moved and max(up, dn) >= LAG_BOOKS and min(up, dn) == 0:
                  d = 1 if up > dn else -1
                  if mkt == "spread":  calls["book_lag"] = s1 if d > 0 else s0
                  else:                calls["book_lag"] = s0 if d > 0 else s1
              return calls, info


          # ---------------------------------------------------------------- path features
          # Every signal above reads TWO observations -- first and current -- from series holding
          # 200-470 of them. A number that drifted a point over six days and one that gapped a
          # point in ten minutes produce identical calls; a money share that crossed 50% and came
          # back looks exactly like one that never moved. Measured 2026-11-22 on NFL spreads:
          # median 232 money observations per game, median swing 21 points, and the money MAJORITY
          # changes sides in 28% of games -- none of which reaches a signal.
          #
          # These are RECORDED, not graded, and no signal consumes them yet. That is deliberate:
          # recording changes no call, so the holdout does not reset, and the features accumulate
          # on every market from today while also being recomputable over the whole archive. When
          # one of them earns a signal, it gets a forward test like everything else rather than
          # being promoted off the in-sample cut that discovered it.
          KEY_NUMBERS = {"nfl": (3, 7, 10, 14, 6), "ncaaf": (3, 7, 10, 14), "cbb": ()}


          def _pf_path(series, upto, val=1, share=4):
              out = []
              for x in series:
                  if x[val] is None or x[0] > upto: continue
                  out.append((x[0], x[val], x[share] if len(x) > share else None))
              return out


          def path_features(p, lim_rows=None, upto=None, sport="cbb"):
              """p = [(ts, line, money_share)] oldest first."""
              if len(p) < 5: return {}
              line = [x[1] for x in p]
              mny = [x[2] for x in p if x[2] is not None]
              net = line[-1] - line[0]
              gross = sum(abs(line[i] - line[i - 1]) for i in range(1, len(line)))
              f = {"n_obs": len(p), "line_net": round(net, 2), "line_gross": round(gross, 2),
                   "line_eff": round(abs(net) / gross, 3) if gross else None,
                   "line_revs": sum(1 for i in range(2, len(line))
                                    if (line[i] - line[i-1]) * (line[i-1] - line[i-2]) < 0)}
              if len(mny) >= 5:
                  f.update({"mny_net": round(mny[-1] - mny[0], 1),
                            "mny_swing": round(max(mny) - min(mny), 1),
                            "mny_last": mny[-1],
                            # the majority of the handle changing sides -- invisible until now
                            "mny_crossings": sum(1 for i in range(1, len(mny))
                                                 if (mny[i] - 50) * (mny[i-1] - 50) < 0),
                            # money that peaks and HOLDS reads 46.9% vs a 51.7% base (n=377,
                            # in-sample, 2026-11-22). money_level cannot see this at all.
                            "mny_gave_back": round(max(mny) - mny[-1], 1)})
              pm = [(a, b, c) for a, b, c in p if c is not None]
              if len(pm) >= 8:
                  st = [(pm[i][1] - pm[i-1][1], pm[i][2] - pm[i-1][2]) for i in range(1, len(pm))]
                  st = [(a, b) for a, b in st if a and b]
                  if st:
                      f["sync"] = round(sum(1 for a, b in st if a * b > 0) / len(st), 3)
                      f["n_sync"] = len(st)
                      f["against_money_pts"] = round(sum(abs(a) for a, b in st if a * b < 0), 2)
              # Pinnacle limit as a PATH. A limit slashed mid-week is Pinnacle pulling back on news
              # it has not finished pricing -- the cheapest news detector we have, needing no news
              # feed. Raw dollars are not comparable across sports ($75k NFL side vs $1k CBB total),
              # so lim_drop_frac rather than the level is the portable quantity.
              if lim_rows:
                  lv = [l for _, l in lim_rows if l]
                  if len(lv) >= 3:
                      pk, lst = max(lv), lv[-1]
                      f["lim_peak"], f["lim_last"] = pk, lst
                      f["lim_drop_frac"] = round(1 - lst / pk, 3) if pk else None
                      f["lim_slashed"] = bool(f["lim_drop_frac"] and f["lim_drop_frac"] >= 0.5)
              # Key numbers. ~15% of NFL games land on exactly 3, so -2.5 -> -3.5 eats the single
              # most likely margin while -4.5 -> -5.5 is the same half point through empty space.
              # CBB was verified to have none (3, 4 and 5 each land 5.5-5.9% over 6,300 games),
              # which is why this is keyed by sport instead of applied everywhere.
              keys = KEY_NUMBERS.get(sport, ())
              if keys:
                  a, b = abs(line[0]), abs(line[-1])
                  lo, hi = min(a, b), max(a, b)
                  f["key_crossed"] = [k for k in keys if lo < k < hi] or None
                  f["key_landed_on"] = b if b in keys else None
                  f["key_dist"] = round(min(abs(b - k) for k in keys), 1)
              return f


          # ---------------------------------------------------------------- mechanical guards
          # Written 2026-11-22 after the operating rules were added to the state doc and then
          # broken three times within hours. Rules did not work; what caught every error was
          # something being absurd -- a $105 limit on a market Pinnacle risks $75,000 on, a 73.8%
          # cover rate, 76% of books moving in the same second. These fire on their own.
          # A -110 market cannot be beaten by much. Anything outside this band on real sample is
          # a measurement bug until proven otherwise, not a finding.
          PLAUSIBLE_LO, PLAUSIBLE_HI = 0.40, 0.60
          BIG_N = 150


          def check_rate(w, l, label="", base=None, lo=PLAUSIBLE_LO, hi=PLAUSIBLE_HI,
                         priced_110=True):
              """Return (hit, n, warnings). Warn loudly rather than silently returning a number.

              The band is deliberately tight. A 57% true edge on n=500 would be the best
              documented result in sports betting; seeing one in our data means checking the
              measurement first and celebrating second."""
              n = w + l
              if not n: return None, 0, ["no decided outcomes"]
              hit = w / n
              warn = []
              # The absolute band only applies where -110 pricing holds. Moneyline base rates sit
              # at 70%+ because favourites win outright, so an unconditioned band fires on every
              # pooled row that contains them -- 95 false alarms on the first CBB run, which would
              # have trained everyone to scroll past the warning. The deviation-from-base check
              # below is the one that generalises.
              if priced_110 and n >= BIG_N and not (lo <= hit <= hi):
                  warn.append(f"IMPLAUSIBLE: {label or 'rate'} {100*hit:.1f}% on n={n}. "
                              f"A -110 market outside {100*lo:.0f}-{100*hi:.0f}% at this sample is a "
                              f"measurement bug until proven otherwise. Recompute from source.")
              if base is not None and n >= BIG_N and abs(hit - base) > 0.12:
                  warn.append(f"CHECK: {label or 'rate'} sits {100*(hit-base):+.1f} pts from its base "
                              f"({100*base:.1f}%). Verify the base is the right comparison and the "
                              f"sample is not a composition artifact.")
              return hit, n, warn


          def composition(items, keyfn, label=""):
              """What a pooled bucket is MADE OF. Call this before reporting any pooled rate.

              On 2026-11-22 the <$750 Pinnacle-limit bucket read 60.5% and the $3k+ bucket 46.9%,
              a clean monotonic trend across four buckets. The first bucket was 154 totals out of
              167; the last was 177 spreads out of 228. The trend was market mix. Holding market
              fixed, the effect survived in totals and vanished entirely on spreads."""
              mix = {}
              for it in items: mix[keyfn(it)] = mix.get(keyfn(it), 0) + 1
              tot = sum(mix.values()) or 1
              dom = max(mix.values()) / tot if mix else 0
              warn = []
              if len(mix) > 1 and dom >= 0.70:
                  top = max(mix, key=mix.get)
                  warn.append(f"COMPOSITION: {label or 'bucket'} is {100*dom:.0f}% {top}. "
                              f"Any difference against another bucket may be composition, not effect. "
                              f"Split by market and report both.")
              return mix, warn


          def field_coverage(seen_fields, consumed_fields, source=""):
              """Fields the data carries that nothing reads.

              Not a style check. Every field in the unused list is a thing the system could be
              using and is not, and the list is how that becomes visible without anyone thinking
              to look. `is_live`, `is_alt_market` and the rotation numbers all sat in this list
              for a season before anyone noticed, at the cost of two matcher defects and ~10% of
              graded closing lines."""
              unused = sorted(set(seen_fields) - set(consumed_fields))
              return {"source": source, "n_seen": len(set(seen_fields)),
                      "n_consumed": len(set(consumed_fields) & set(seen_fields)),
                      "unused": unused}


          def report(warnings, where=""):
              """Print warnings so they land in the Actions log where they cannot be scrolled past."""
              for w in warnings:
                  print(f"  !! {where+': ' if where else ''}{w}", flush=True)
              return bool(warnings)



          # ---------------------------------------------------------------- idea register
          # Justin's ideas and whether the engine actually consumes them. Printed on every run
          # because a doc has to be opened and a run log does not.
          #
          # The failure this exists for: his core thesis -- the number moving toward a side
          # holding a minority of BOTH tickets and money -- was not in the engine for weeks.
          # rlm_ratio actively excluded it by requiring money/tix >= 1.2. He raised it repeatedly
          # and it was argued about in chat from whichever in-sample cut was handy, rather than
          # instrumented and left to accumulate a record. It became a signal on 2026-11-20 only
          # after he asked why he kept having to correct us.
          #
          # RECORDED means the measurement sits on every market and no signal reads it. That is
          # the same failure as is_live and the rotation numbers one level up: the data is there
          # and nothing asks it a question. Promotion to SIGNAL resets the holdout, which is the
          # honest reason these sit -- but it has to be a decision he makes, not a default that
          # happens because nobody raised it. Full detail in claude/propwatch-idea-register.md.
          IDEAS = [
              ("reverse line movement + split confirmation", "SIGNAL",   "rlm, rlm_ratio"),
              ("Pinnacle as fair value, retail gaps",        "SIGNAL",   "pin_value, pin_rlm"),
              ("minority tickets AND money, line moves there","SIGNAL",  "rlm_quiet"),
              ("most-bet games are where to fade the public", "RECORDED", "volume buckets; NO signal"),
              ("key numbers 3 and 7",                        "RECORDED", "key_crossed, key_dist"),
              ("limit slashed mid-week = unpriced news",     "RECORDED", "lim_slashed"),
              ("money path across the week, switches",       "RECORDED", "path features"),
              ("Pinnacle is not always right",               "TESTED",   "limit-conditioned; not a gate"),
              ("CFB limits scale differently than NFL",      "OPEN",     "raw limits still compared"),
              ("steam: many books moving at once",           "OPEN",     "breadth only; timestamps shared"),
              ("our own lines / closing-line model",         "OPEN",     "needs hoopR"),
          ]


          def print_idea_register():
              n_rec = sum(1 for _, s, _ in IDEAS if s == "RECORDED")
              n_open = sum(1 for _, s, _ in IDEAS if s in ("OPEN", "TESTED"))
              print(f"  idea register: {sum(1 for _,s,_ in IDEAS if s=='SIGNAL')} signals, "
                    f"{n_rec} recorded-but-unused, {n_open} open", flush=True)
              for name, st, where in IDEAS:
                  if st != "SIGNAL":
                      print(f"     [{st:8}] {name}  --  {where}", flush=True)


          def read(gid, mkt, t, ser, openers, prow, books=None):
              """The system's read on one market at time t. Returns None if no FanDuel line yet."""
              s0, s1 = SIDES[mkt]
              A, B = ser.get((gid, mkt, s0), []), ser.get((gid, mkt, s1), [])
              a, b = at(A, t), at(B, t)
              if not a or not b or a[1] is None or b[1] is None: return None
              fa = next((x for x in A if x[3] is not None), None)
              fb = next((x for x in B if x[3] is not None), None)
              side = {s0: {"v": a[1], "o": a[2], "tx": a[3], "mn": a[4]},
                      s1: {"v": b[1], "o": b[2], "tx": b[3], "mn": b[4]}}
              r = {"t": a[0], "nb": a[5], "line": {s0: a[1], s1: b[1]}, "odds": {s0: a[2], s1: b[2]},
                   "tix": {s0: a[3], s1: b[3]}, "mny": {s0: a[4], s1: b[4]}, "calls": {}}
              op = ((openers.get(gid) or {}).get("open") or {}).get(f"{mkt}|{s0}")
              # The collector stores each opener as [handicap, price]. A moneyline has no
              # handicap, so index 0 is a literal 0 -- which is what this read for all 332
              # graded games, making every move-based signal on moneylines (follow_move, rlm,
              # rlm_ratio, pre_move, pin_rlm) measure a move against zero. The price was in the
              # archive the whole time at index 1; only the grader was wrong, so fixing it
              # restates the entire moneyline history on the next run rather than starting over.
              r["open"] = (op[1] if mkt == "moneyline" else op[0]) if op else None
              # Both sides of the opener, for the same reason as pin_side: read() computes
              # everything from the s0 (home/over) series, and the board prints those scalars
              # next to whichever side the lean is on. SPC@MASSL rendered "FD now +176, open
              # -265" -- +176 was the away price and -265 the HOME opener, making a normal
              # market look like a 440-cent collapse. Fourth instance of this family in one row.
              _op1 = ((openers.get(gid) or {}).get("open") or {}).get(f"{mkt}|{s1}")
              _v = (lambda q: (q[1] if mkt == "moneyline" else q[0]) if q else None)
              r["open_side"] = {s0: r["open"], s1: _v(_op1)}

              # --- money_delta: money share on a side has RISEN while that side still holds a
              #     ticket minority. Level is a coin flip (a side peaking above 95% of handle
              #     covers 53.4%); the DIRECTION carries -- rising into a 35-50% ticket side ran
              #     57.1% over 399 markets, rising into a MAJORITY ticket side ran 44.9%, the
              #     worst cell measured. The ticket cap is load-bearing: without it this inverts.
              #     Baseline is the first reading with real splits, never AN's 0/0 placeholder --
              #     using the placeholder is what made money_moving a duplicate of sharp_gap.
              _b0 = next((x for x in A if x[3] not in (None, 0)), None)
              _b1 = next((x for x in B if x[3] not in (None, 0)), None)
              for _sd, _now, _base in ((s0, a, _b0), (s1, b, _b1)):
                  if not _base or _now[4] is None or _base[4] is None or _now[3] is None: continue
                  _d = _now[4] - _base[4]
                  if _d >= MONEY_DELTA_MIN and _now[3] < MONEY_DELTA_TIX_MAX:
                      prev = r.get("money_delta_pts")
                      if prev is None or _d > prev:
                          r["money_delta_pts"] = round(_d, 1)
                          r["calls"]["money_delta"] = _sd

              # follow_move: spread home value falling = moving toward home; total rising = toward over.
              # moneyline has no handicap, so the move is in PRICE: the side whose implied
              # probability rose is the side the market moved toward.
              if r["open"] is not None and a[1] != r["open"]:
                  if mkt == "moneyline":
                      i_now, i_open = imp(a[1]), imp(r["open"])
                      if i_now is not None and i_open is not None and i_now != i_open:
                          r["calls"]["follow_move"] = s0 if i_now > i_open else s1
                  else:
                      up = a[1] > r["open"]
                      r["calls"]["follow_move"] = (s1 if up else s0) if mkt == "spread" else (s0 if up else s1)
                  moved_to = r["calls"].get("follow_move")
                  if moved_to and None not in (a[3], b[3], a[4], b[4]):
                      t_ = {s0: a[3], s1: b[3]}.get(moved_to)
                      m_ = {s0: a[4], s1: b[4]}.get(moved_to)
                      if t_ and m_ is not None:
                          ratio = m_ / t_
                          r["mny_ratio"] = round(ratio, 2)
                          if t_ < RLM_TIX_MAX and ratio >= RLM_RATIO_MIN:
                              r["calls"]["rlm_ratio"] = moved_to

                          # --- rlm_quiet: Justin's thesis, instrumented rather than argued about.
                          #     The number moves toward a side holding a MINORITY of tickets AND a
                          #     MINORITY of money. rlm_ratio explicitly excludes this case (it wants
                          #     money/tix >= 1.2), so the engine had no record of it and it kept
                          #     getting re-litigated in chat from whichever in-sample cut was handy.
                          #     The claim: if the book moves a number when neither ticket count nor
                          #     handle is forcing it, the little money that did arrive was respected
                          #     money. A first in-sample pass over 671 games read 22-39 pooled, but
                          #     that is one cut at n=61 and the project's own rule is that in-sample
                          #     numbers are hypotheses. This gets a forward record like everything
                          #     else, and the forward record decides it.
                          if t_ < RLM_TIX_MAX and m_ < RLM_MNY_MAX:
                              r["calls"]["rlm_quiet"] = moved_to
                              r["rlm_quiet_tix"] = t_
                              r["rlm_quiet_mny"] = m_

                  # --- pre_move: money is on the minority-ticket side at an outsized ratio and the
                  #     number has NOT moved yet. The claim is that the move is still to come, which
                  #     is the opposite of rlm_ratio and is what "get the line before it moves" means.
                  if None not in (a[3], b[3], a[4], b[4]) and r.get("open") is not None:
                      line_static = (a[1] == r["open"])
                      for sd_, t_, m_ in ((s0, a[3], a[4]), (s1, b[3], b[4])):
                          if not t_: continue
                          if line_static and t_ < RLM_TIX_MAX and (m_ / t_) >= RLM_RATIO_MIN:
                              r["calls"]["pre_move"] = sd_
                              r["pre_move_tix"] = t_
                              r["pre_move_ratio"] = round(m_ / t_, 2)
              if a[4] is not None and b[4] is not None and a[4] != b[4]:
                  r["calls"]["money_level"] = s0 if a[4] > b[4] else s1
              if None not in (a[3], a[4], b[3], b[4]):
                  ga, gb = a[4] - a[3], b[4] - b[3]
                  if max(ga, gb) > 0 and ga != gb:
                      r["calls"]["sharp_gap"] = s0 if ga > gb else s1
                  r["gap"] = {s0: ga, s1: gb}
              if fa and fb and None not in (a[3], a[4], b[3], b[4]) and fa[0] < a[0]:
                  da = (a[4] - fa[4]) - (a[3] - fa[3])
                  db = (b[4] - fb[4]) - (b[3] - fb[3])
                  if max(da, db) > 0 and da != db:
                      r["calls"]["money_moving"] = s0 if da > db else s1
                  r["div"] = {s0: da, s1: db}
              bc, bi = book_read(books, mkt, t, a[1], r.get("open"), s0, s1)
              r["calls"].update(bc)
              if bi: r["books"] = bi
              if prow:
                  p = pin_at(prow, mkt, s0, t)
                  if p and p[3] is not None:
                      # Pinnacle's number for BOTH sides. r["pin"] is the s0 (home/over) side,
                      # and the board prints it beside whichever side the lean is on -- for an
                      # away moneyline lean that showed Pinnacle's HOME price, so SPC@MASSL read
                      # "FD +176, Pin -218" as if FanDuel were offering a dog price on a side
                      # Pinnacle had at -218. Same side-confusion as the FLAGGED table printed
                      # with two books; third instance of this family. Store the other side too
                      # and let the board pick the one it is actually talking about.
                      r["pin"], r["pin_lim"] = p[3], p[4]
                      _q = pin_at(prow, mkt, s1, t)
                      r["pin_side"] = {s0: p[3],
                                       s1: (_q[3] if _q and _q[3] is not None else
                                            (-p[3] if mkt == "spread" else
                                             p[3] if mkt == "total" else None))}
                      if mkt == "moneyline":
                          q = pin_at(prow, mkt, s1, t)
                          po, pu = imp(p[3]), imp(q[3] if q else None)
                          if po and pu:
                              fair0 = po / (po + pu)
                              e0 = fair0 * dec(a[2]) - 1 if a[2] else -9
                              e1 = (1 - fair0) * dec(b[2]) - 1 if b[2] else -9
                              r["fair"] = round(100 * fair0, 1)
                              if max(e0, e1) > 0:
                                  r["calls"]["pin_value"] = s0 if e0 > e1 else s1
                      elif a[1] != p[3]:
                          if mkt == "spread":        # FD gives home more points than Pinnacle -> home
                              r["calls"]["pin_value"] = s0 if a[1] > p[3] else s1
                          else:                      # FD total above Pinnacle -> under
                              r["calls"]["pin_value"] = s1 if a[1] > p[3] else s0

                      p0 = next((x for x in prow if x[1] == mkt and x[2] == s0 and x[3] is not None), None)

                      # --- pin_move: Pinnacle's OWN number has travelled, take the side it
                      #     travelled toward. No public test, no money ratio, no comparison with
                      #     FanDuel -- that is the point. Pinnacle's POSITION relative to FanDuel
                      #     orders nothing (>= +1.0pt -5.2%, same -3.5%, <= -1.0pt -1.8%, no
                      #     monotonicity over 2,950 markets); Pinnacle's MOTION orders outcomes at
                      #     every level of what FanDuel did.
                      if p0 and p0[3] is not None and p[3] is not None:
                          if mkt == "moneyline":
                              i1, i0 = imp(p[3]), imp(p0[3])
                              if i1 and i0 and abs(i1 - i0) >= 0.01:
                                  r["pin_move_to"] = s0 if i1 > i0 else s1
                                  r["pin_move_pts"] = round(100 * (i1 - i0), 1)
                                  r["calls"]["pin_move"] = r["pin_move_to"]
                          elif abs(p[3] - p0[3]) >= PIN_MOVE_MIN:
                              up = p[3] > p0[3]
                              to = (s1 if up else s0) if mkt == "spread" else (s0 if up else s1)
                              r["pin_move_to"] = to
                              r["pin_move_pts"] = round(abs(p[3] - p0[3]), 1)
                              r["calls"]["pin_move"] = to

                      # --- path features: recorded, never graded (see path_features above)
                      _pp = _pf_path(A, t)
                      if _pp:
                          _lr = [(x[0], x[4]) for x in prow
                                 if x[1] == mkt and x[2] == s0 and len(x) > 4 and x[0] <= t]
                          r["path"] = path_features(_pp, _lr, t, "cbb")

                      # --- pin_bounce: has the move we are citing already retraced? DISPLAY ONLY.
                      #     pin_move and pin_rlm both compare FIRST-SEEN to CURRENT, so a number
                      #     that travelled 136.5 -> 131 -> 135 reports as a 1.5pt drop and looks
                      #     identical to one still on its way down. UTEP@NMSU, 2026-11-19: Pinnacle
                      #     bottomed at 131 at 09:42 ET and had been climbing for 4.5h when the
                      #     board flagged it as "136.5 -> 132, the biggest move on the board". The
                      #     pick bought the bottom of a finished move and sat 2pts the wrong side of
                      #     the number within hours.
                      #     Measured and PRINTED, never gated: gating this is a signal change and
                      #     would reset the holdout. Decide that on evidence, not on one bad night.
                      if p0 and p0[3] is not None and p[3] is not None:
                          _s = [x[3] for x in prow
                                if x[1] == mkt and x[2] == s0 and x[3] is not None and x[0] <= t]
                          if mkt == "moneyline":
                              _s = [100 * imp(v) for v in _s if imp(v) is not None]
                          if len(_s) >= 2:
                              _lo, _hi, _a, _z = min(_s), max(_s), _s[0], _s[-1]
                              # retracement measured against the NET direction first->last
                              _b = ((_z - _lo) if _z < _a else (_hi - _z) if _z > _a
                                    else max(_z - _lo, _hi - _z))
                              r["pin_bounce"] = round(_b, 1)
                              r["pin_extreme"] = round(_lo if _z <= _a else _hi, 1)

                      # --- pin_rlm: PINNACLE moved against the public, splits confirm
                      if p0 and p0[3] != p[3] and None not in (a[3], b[3], a[4], b[4]):
                          if mkt == "moneyline":
                              i1, i0 = imp(p[3]), imp(p0[3])
                              pin_to = (s0 if i1 > i0 else s1) if (i1 and i0 and i1 != i0) else None
                          else:
                              up = p[3] > p0[3]
                              pin_to = (s1 if up else s0) if mkt == "spread" else (s0 if up else s1)
                          if pin_to:
                              r["pin_open"], r["pin_moved_to"] = p0[3], pin_to
                              # Pinnacle's own before/after ON THE FLAGGED SIDE. p0/p are the
                              # s0 (home/over) row, so without this the board printed FanDuel's
                              # current number next to Pinnacle's opening number, and quoted the
                              # home/over price when the flagged side was away/under.
                              if pin_to == s0:
                                  r["pin_mv_from"], r["pin_mv_to"] = p0[3], p[3]
                              elif mkt == "moneyline":
                                  q0 = next((z for z in prow if z[1] == mkt and z[2] == s1
                                             and z[3] is not None), None)
                                  r["pin_mv_from"] = q0[3] if q0 else None
                                  r["pin_mv_to"] = q[3] if (q and q[3] is not None) else None
                              elif mkt == "spread":
                                  r["pin_mv_from"], r["pin_mv_to"] = -p0[3], -p[3]
                              else:
                                  r["pin_mv_from"], r["pin_mv_to"] = p0[3], p[3]
                              tix = {s0: a[3], s1: b[3]}; mny = {s0: a[4], s1: b[4]}
                              pub = max(tix, key=lambda k: tix[k])
                              t_, m_ = tix.get(pin_to), mny.get(pin_to)
                              if (pub != pin_to and tix[pub] >= PUBLIC_MIN and t_
                                      and m_ is not None and (m_ / t_) >= RLM_RATIO_MIN):
                                  r["calls"]["pin_rlm"] = pin_to
                                  r["pin_rlm_tix"] = t_
                                  r["pin_rlm_ratio"] = round(m_ / t_, 2)
              return r


          def result(mkt, side, line, fin):
              if mkt == "moneyline":
                  d = fin["hs"] - fin["as"] if side == "home" else fin["as"] - fin["hs"]
                  return "W" if d > 0 else ("L" if d < 0 else "P")
              if mkt == "spread":
                  m = fin["hs"] - fin["as"] if side == "home" else fin["as"] - fin["hs"]
                  x = m + line
              else:
                  tot = fin["hs"] + fin["as"]
                  x = tot - line if side == "over" else line - tot
              return "W" if x > 0 else ("L" if x < 0 else "P")


          def profit(odds, res):
              if res == "P" or odds is None: return 0.0
              if res == "L": return -1.0
              return 100.0 / -odds if odds < 0 else odds / 100.0


          def clv(mkt, side, v_then, v_close):
              """closing-line value. Points for spread/total; for a moneyline there is no handicap,
              so it is percentage points of implied probability."""
              if mkt == "moneyline":
                  a, b = imp(v_then), imp(v_close)
                  return round(100 * (b - a), 1) if (a is not None and b is not None) else None
              if mkt == "spread": return v_then - v_close
              return (v_close - v_then) if side == "over" else (v_then - v_close)


          def favoured(mkt, side, r):
              """The 'default' side: the favourite on a spread, the over on a total. A signal has
              to be scored against the base rate of the sides it ACTUALLY picked -- a signal that
              is structurally long favourites looks like genius in any stretch favourites run."""
              if mkt == "total": return side == "over"
              hl = r["line"].get("home")
              if hl is None: return None
              if mkt == "moneyline":
                  al = r["line"].get("away")
                  if al is None: return None
                  return side == ("home" if hl < al else "away")   # shorter price = favourite
              return side == ("home" if hl < 0 else "away")


          # ---------------------------------------------------------------------------
          # HOLDOUT. Every signal, threshold and PROMOTE/DROP label in this file was
          # chosen while looking at games before this date. pin_value went 108-68 in
          # first halves -- fitted and scored on the same 176 games, never once tested on
          # a game it did not help choose. So every record is reported twice:
          #   fit  before HOLDOUT_FROM -- in-sample, a label there is a HYPOTHESIS
          #   fwd  on or after it      -- out-of-sample, a label there is EVIDENCE
          # Changing a threshold moves this date forward and restarts the forward test.
          # Bumped 2026-11-19 when pin_move and money_delta were added. Adding a signal is
          # exactly the change this date exists to charge for: games through 2026-11-19 are
          # the window those two were designed in, so they are fit, not evidence.
          HOLDOUT_FROM = "2026-11-21"
          # ---------------------------------------------------------------------------


          def period_of(g):
              return "fwd" if (g.get("tip") or g.get("kickoff") or g.get("start") or "")[:10] >= HOLDOUT_FROM else "fit"


          def base_rates(graded, period=None):
              """How often the default side actually won, measured on this sample.

              Per period: scoring the forward test against the fit window's own favourite
              rate would re-import the bias the split exists to remove."""
              fw = fn = ow = on = mw = mn_ = 0
              for g in graded:
                  if period and period_of(g) != period: continue
                  fin = g.get("final")
                  if not fin: continue
                  for mkt, m in g["markets"].items():
                      cl = m.get("close")
                      if not cl: continue
                      for side in SIDES[mkt]:
                          if favoured(mkt, side, cl) is not True: continue
                          res = result(mkt, side, cl["line"][side], fin)
                          if res == "P": continue
                          if mkt == "spread": fn += 1; fw += (res == "W")
                          elif mkt == "moneyline": mn_ += 1; mw += (res == "W")
                          else: on += 1; ow += (res == "W")
              return {"spread_fav_rate": (fw / fn) if fn else 0.5, "spread_n": fn,
                      "total_over_rate": (ow / on) if on else 0.5, "total_n": on,
                      "ml_fav_rate": (mw / mn_) if mn_ else 0.5, "ml_n": mn_}


          def bucket(x, table):
              if x is None: return None
              for lo, hi, lab in table:
                  if lo <= x < hi: return lab
              return None


          # ------------------------------------------------------------------ build
          def build():
              games, ser, openers, pin, finals, BK = load()
              pin_keys = list(pin.keys())
              now = now_utc(); nowts = tsfmt(now)
              graded, upcoming = [], []
              unmatched = 0
              for gid, g in games.items():
                  tipts = iso_to_ts(g["tip"])
                  before = lambda t: t < tipts
                  pk = match_pin(g, pin_keys)
                  prow = pin.get(pk[:2], []) if pk else []
                  if pk and pk[2] and prow: prow = swap_sides(prow)
                  firsts = [s[0][0] for (gg, m, sd), s in ser.items() if gg == gid and s]
                  if not firsts: continue
                  first = min(firsts)
                  e_t = tsfmt(parse_ts(first) + dt.timedelta(minutes=EARLY_MIN))
                  rec = {"gid": gid, "game": g["g"], "away": g.get("away_name"), "home": g.get("home_name"),
                         "tip": g["tip"], "conf": [g.get("ac"), g.get("hc")], "first_seen": first,
                         "caught": (openers.get(gid) or {}).get("caught"), "pin_match": (pk[0] + (" (reversed)" if pk[2] else "")) if pk else None,
                         "markets": {}}
                  if tipts > nowts:
                      for mkt in MARKETS:
                          r = read(gid, mkt, nowts, ser, openers, prow, BK.get((gid, mkt)))
                          if r: rec["markets"][mkt] = {"now": r}
                      if rec["markets"]: upcoming.append(rec)
                      continue
                  fin = match_final(g, finals)
                  if not fin:
                      unmatched += 1; continue
                  rec["final"] = fin
                  last_pre = tsfmt(parse_ts(tipts) - dt.timedelta(minutes=1))
                  for mkt in MARKETS:
                      cl = read(gid, mkt, last_pre, ser, openers, prow, BK.get((gid, mkt)))
                      if not cl: continue
                      ea = (read(gid, mkt, e_t, ser, openers, prow, BK.get((gid, mkt)))
                            if before(e_t) else None)
                      out = {"close": cl}
                      if ea: out["early"] = ea
                      for cp, r in (("early", ea), ("close", cl)):
                          if not r: continue
                          gr = {}
                          for sig, side in r["calls"].items():
                              res = result(mkt, side, r["line"][side], fin)
                              gr[sig] = {"side": side, "line": r["line"][side], "odds": r["odds"][side],
                                         "res": res, "units": round(profit(r["odds"][side], res), 3),
                                         "took_fav": favoured(mkt, side, r)}
                              if cp == "early":
                                  gr[sig]["clv"] = clv(mkt, side, r["line"][side], cl["line"][side])
                          out[cp + "_graded"] = gr
                      rec["markets"][mkt] = out
                  if rec["markets"]: graded.append(rec)
              graded.sort(key=lambda r: r["tip"]); upcoming.sort(key=lambda r: r["tip"])
              return graded, upcoming, unmatched


          def summarize(graded, brs):
              """brs maps period -> base rates, for "all", "fit" and "fwd"."""
              def blank(): return {"n": 0, "W": 0, "L": 0, "P": 0, "units": 0.0, "clv": [],
                                   "fav": 0, "dec": 0, "exp": 0.0}
              S = collections.defaultdict(blank)
              for g in graded:
                  per = period_of(g)
                  for mkt, m in g["markets"].items():
                      for cp in ("early", "close"):
                          gr = m.get(cp + "_graded") or {}
                          r = m.get(cp) or {}
                          tags = ["all", bucket(r.get("nb"), NB_BUCKETS), bucket(r.get("pin_lim"), LIM_BUCKETS)]
                          def rate_for(p_):
                              br = brs[p_]
                              return (br["spread_fav_rate"] if mkt == "spread" else
                                      br["ml_fav_rate"] if mkt == "moneyline" else
                                      br["total_over_rate"])
                          # singles, then every PAIR of signals that agree on a side. Signals are
                          # evidence, not independent bets, and evidence combines: minority tickets
                          # is 42.9% alone and line-moved-toward is 49.8%, but together 52.7%.
                          items = list(gr.items())
                          pairs = [(f"{p}+{q}", gr[p])
                                   for p, q in itertools.combinations(sorted(gr), 2)
                                   if gr[p]["side"] == gr[q]["side"]]
                          for sig, x in items + pairs:
                              for tag in tags:
                                  if not tag: continue
                                  for mk in (mkt, "both"):
                                      for pr in ("all", per):
                                          s = S[(sig, cp, mk, tag, pr)]
                                          rate = rate_for(pr)
                                          s["n"] += 1; s[x["res"]] += 1; s["units"] += x["units"]
                                          # what this bucket is MADE of. A "both" row or a limit
                                          # slice can be 92% one market, and then a difference
                                          # against another bucket is composition, not effect --
                                          # which is exactly how a monotonic Pinnacle-limit trend
                                          # turned out to be 154-of-167 totals vs 177-of-228
                                          # spreads on 2026-11-22.
                                          s.setdefault("mkts", {})
                                          s["mkts"][mkt] = s["mkts"].get(mkt, 0) + 1
                                          if "clv" in x: s["clv"].append(x["clv"])
                                          if x["res"] != "P" and x.get("took_fav") is not None:
                                              s["dec"] += 1
                                              s["fav"] += bool(x["took_fav"])
                                              s["exp"] += rate if x["took_fav"] else (1 - rate)
              out = []
              for (sig, cp, mk, tag, pr), s in S.items():
                  dec = s["W"] + s["L"]
                  _mx = s.get("mkts") or {}
                  if len(_mx) > 1:
                      _tot = sum(_mx.values())
                      row_mix = {k: round(100 * v / _tot) for k, v in sorted(_mx.items())}
                      _dom = max(_mx.values()) / _tot
                      # Only where composition actually confounds: the volume and limit SLICES,
                      # which get compared against each other. A "both" row at tag="all" is pooled
                      # by design and warning on it produced 108 alarms on the first run -- noise
                      # that trains everyone to scroll past, the same failure as the 95 before it.
                      if tag != "all" and _dom >= 0.85 and dec >= 100:
                          _cw = [f"COMPOSITION: {sig}/{cp}/{mk}/{tag} is "
                                 f"{100*_dom:.0f}% {max(_mx, key=_mx.get)} -- any difference vs "
                                 f"another bucket may be mix, not effect. Split by market."]
                          report(_cw, "")
                  else:
                      row_mix = None
                  hit = s["W"] / dec if dec else None
                  z = (s["W"] - dec * BREAKEVEN) / math.sqrt(dec * 0.25) if dec else None
                  z50 = (s["W"] - dec * 0.5) / math.sqrt(dec * 0.25) if dec else None
                  row = {"signal": sig, "checkpoint": cp, "market": mk, "slice": tag,
                         "market_mix": row_mix,
                         "period": pr, "n": s["n"],
                         "W": s["W"], "L": s["L"], "P": s["P"],
                         "hit_pct": round(100 * hit, 1) if hit is not None else None,
                         "units": round(s["units"], 2), "roi_pct": round(100 * s["units"] / s["n"], 1) if s["n"] else None,
                         "z_vs_breakeven": round(z, 2) if z is not None else None}
                  if s["dec"]:
                      exp = 100 * s["exp"] / s["dec"]
                      row["picked_default_pct"] = round(100 * s["fav"] / s["dec"], 1)
                      row["expected_pct"] = round(exp, 1)
                      row["edge_pts"] = round(100 * s["W"] / dec - exp, 1) if dec else None
                  if s["clv"]:
                      c = sorted(s["clv"])
                      row["clv_avg"] = round(sum(c) / len(c), 2)
                      row["clv_pos_pct"] = round(100 * sum(1 for x in c if x > 0) / len(c), 1)
                  e = row.get("edge_pts")
                  if dec >= MIN_N:
                      verdict = (
                          "PROMOTE: beats break-even and its own base rate" if z >= 1.5 and (e or 0) >= 5 else
                          "beats break-even but not its base rate -- directional bias, not signal"
                          if z >= 1.5 else
                          "INVERT candidate: wrong well beyond its base rate" if (e or 0) <= -15 else
                          "DROP: below break-even" if z <= -1.5 else "no edge shown yet")
                      # in-sample verdicts are guesses about the future, not findings about it
                      row["proposal"] = (f"HYPOTHESIS (in-sample) -- {verdict}" if pr == "fit"
                                         else verdict)
                      # A -110 market cannot be beaten by 10+ points on real sample. When a row
                      # reads outside 40-60% at n>=150 the measurement is wrong far more often
                      # than the market is: the 2026-11-22 sequencing analysis read 65.4% and
                      # 73.8% purely because results were inferred from another signal instead of
                      # computed from the final score. Flag it in the row itself so it cannot be
                      # quoted as a finding without the warning attached.
                      _h, _n, _w = check_rate(s["W"], dec - s["W"], label=f"{sig} {cp} {mk} {tag}",
                                              base=(exp / 100 if dec else None),
                                              priced_110=(mk in ("spread", "total")))
                      if _w:
                          row["proposal"] = "!! " + _w[0] + "  ||  " + row["proposal"]
                          report(_w, f"{sig}/{cp}/{mk}/{tag}")
                  else:
                      row["proposal"] = f"keep collecting ({dec}/{MIN_N})"
                  out.append(row)
              # mark pairs that merely restate a component: same W-L as one of its own halves
              single = {(r["signal"], r["checkpoint"], r.get("market"), r["slice"], r["period"]):
                        (r["W"], r["L"]) for r in out if "+" not in r["signal"]}
              for r in out:
                  if "+" not in r["signal"]: continue
                  a, b = r["signal"].split("+", 1)
                  rec_ = (r["W"], r["L"])
                  for comp in (a, b):
                      if single.get((comp, r["checkpoint"], r.get("market"),
                                     r["slice"], r["period"])) == rec_:
                          r["redundant_with"] = comp
                          r["proposal"] = f"redundant -- identical record to {comp} alone, not independent confirmation"
                          break

              order = {s: i for i, s in enumerate(SIGNALS)}
              perord = {"all": 0, "fit": 1, "fwd": 2}
              out.sort(key=lambda r: (perord.get(r["period"], 9), r["slice"] != "all",
                                      r["market"] != "both", r["checkpoint"],
                                      "+" in r["signal"], order.get(r["signal"], 9),
                                      r["market"], r["slice"]))
              return out


          def fmt_rec(r):
              return f"{r['W']}-{r['L']}" + (f"-{r['P']}" if r["P"] else "")


          def scorecard_md(summary, graded, unmatched, brs, gen):
              br = brs["all"]
              nfit = sum(1 for g in graded if period_of(g) == "fit")
              nfwd = len(graded) - nfit
              L = [f"# CBB scorecard", "",
                   f"Generated {gen}. {len(graded)} graded games"
                   f" ({unmatched} finished games had no final score matched and are not graded).", "",
                   "## Read this first: fit vs forward", "",
                   f"**{nfit} games before {HOLDOUT_FROM} (fit) · {nfwd} on or after it (forward).**",
                   "",
                   "Every signal, threshold and PROMOTE/DROP label here was chosen while looking at",
                   f"the games before {HOLDOUT_FROM}. `pin_value` went 108-68 in first halves --",
                   "fitted and scored on the same 176 games, never tested on one it did not help",
                   "choose. So every record appears twice:", "",
                   "- **FIT** — in-sample. A label here is a **hypothesis**.",
                   "- **FORWARD** — out-of-sample. A label here is **evidence**.", "",
                   "Base rates are measured separately in each period, so the forward test is not",
                   "scored against the fit window's own favourite rate.", "",
                   "The board weights a signal by its FIT edge until it has",
                   f"{MIN_N} decided forward outcomes, then by its FORWARD edge. Changing any",
                   "threshold moves the holdout date and restarts the forward test.", "",
                   "Each signal is graded on **every** game it had an opinion on, at the FanDuel price",
                   "available at that moment. EARLY = one hour after the line was first seen. CLOSE =",
                   "last number before tip. Break-even at -110 is 52.4%. CLV = points of closing-line",
                   "value; positive means the number you would have taken beat the close.", "",
                   "`expected %` is the base rate of the sides that signal actually picked, measured",
                   "on this sample. `edge` is hit% minus that. A signal that is structurally long",
                   "favourites or overs beats 50% whenever those run, which is not an edge -- this",
                   f"sample ran **{100*br['spread_fav_rate']:.1f}% favourites** (n={br['spread_n']}) and "
                   f"**{100*br['total_over_rate']:.1f}% overs** (n={br['total_n']}) and "
                   f"**{100*br['ml_fav_rate']:.1f}% moneyline favourites** (n={br['ml_n']}).", "",
                   "Moneyline has no handicap: `follow_move` reads price, CLV is percentage points",
                   "of implied probability, and `pin_value` is a pure price comparison.", "",
                   f"Proposals appear once a signal has {MIN_N} decided games. Nothing changes",
                   "automatically.", ""]
              for per, head, note in (
                      ("fwd", "FORWARD (out-of-sample — this is the evidence)",
                       f"Games tipping on or after {HOLDOUT_FROM}. Nothing in the engine was chosen "
                       f"using these. n={nfwd} games."),
                      ("fit", "FIT (in-sample — this is the hypothesis)",
                       f"Games before {HOLDOUT_FROM}. The engine was built by looking at these, so a "
                       f"strong record here is expected and proves nothing. n={nfit} games.")):
                  L += [f"# {head}", "", note, ""]
                  if per == "fwd" and nfwd == 0:
                      L += ["*No games yet. The forward test starts with the next tip.*", ""]
                      continue
                  for cp in ("early", "close"):
                      L += [f"## {cp.upper()}  ({per})", "",
                            "| signal | market | record | hit % | expected % | edge | units | ROI % | CLV avg | CLV + % | status |",
                            "|---|---|---|---|---|---|---|---|---|---|---|"]
                      for r in summary:
                          if (r["slice"] != "all" or r["checkpoint"] != cp
                                  or r["period"] != per): continue
                          L.append(f"| {r['signal']} | {r['market']} | {fmt_rec(r)} | {r['hit_pct']} | "
                                   f"{r.get('expected_pct', '')} | {r.get('edge_pts', '')} | "
                                   f"{r['units']:+} | {r['roi_pct']} | {r.get('clv_avg', '')} | "
                                   f"{r.get('clv_pos_pct', '')} | {r['proposal']} |")
                      L.append("")
              L += ["# Pooled (fit + forward together)", "",
                    "Kept for continuity. **Contaminated** — it mixes the games the engine was built",
                    "on with the games testing it. Use the forward table for any decision.", ""]
              for cp in ("early", "close"):
                  L += [f"## {cp.upper()}  (pooled)", "",
                        "| signal | market | record | hit % | expected % | edge | units | ROI % | CLV avg | CLV + % | status |",
                        "|---|---|---|---|---|---|---|---|---|---|---|"]
                  for r in summary:
                      if (r["slice"] != "all" or r["checkpoint"] != cp
                              or r["period"] != "all"): continue
                      L.append(f"| {r['signal']} | {r['market']} | {fmt_rec(r)} | {r['hit_pct']} | "
                               f"{r.get('expected_pct', '')} | {r.get('edge_pts', '')} | "
                               f"{r['units']:+} | {r['roi_pct']} | {r.get('clv_avg', '')} | "
                               f"{r.get('clv_pos_pct', '')} | {r['proposal']} |")
                  L.append("")
              L += ["## By market depth (both markets, pooled)", "",
                    "| signal | checkpoint | slice | record | hit % | edge | ROI % | CLV avg |",
                    "|---|---|---|---|---|---|---|---|"]
              for r in summary:
                  if r["slice"] == "all" or r["market"] != "both": continue
                  L.append(f"| {r['signal']} | {r['checkpoint']} | {r['slice']} | {fmt_rec(r)} | "
                           f"{r['hit_pct']} | {r.get('edge_pts', '')} | {r['roi_pct']} | "
                           f"{r.get('clv_avg', '')} |")
              return "\n".join(L) + "\n"


          def flagged_md(live, summary, rec_of, label_of):
              """Reverse line movement WITH public-split confirmation, pulled to the top of the
              board instead of buried in a signal list. Three tiers:
                PINNACLE moved against the public  (pin_rlm)    -- the sharp book repricing
                FanDuel moved against the public   (rlm_ratio)  -- a retail book reacting
                line moved off a >=60% public side (rlm)        -- no money-ratio requirement

              The third tier exists because the first two were screening out the stated rule.
              pin_rlm and rlm_ratio both demand that the side the line moved TOWARD carries at
              least RLM_RATIO_MIN times its share of money. The original template is about the
              side the line moved AWAY from: the crowd holds the tickets AND the money, and the
              number goes the other way regardless. IND@HOU on 2026-11-19 was exactly that --
              73% of tickets and 76% of money on the over, total 44.5 -> 43.5, 17,670 bets, the
              heaviest volume on the card -- and it appeared nowhere, because the under's money
              ratio was 0.89. Plain `rlm` fired on it and had no surface to appear on.

              Tier 3 is intentionally the weakest and is labelled so: `rlm` is 5-17 in NFL. It is
              here to be SEEN and graded, not to be trusted."""
              hits = []
              for x in live:
                  r = x["now"] if "now" in x else x
                  for rank, (sig, tier) in enumerate((
                          ("pin_rlm", "PINNACLE moved vs public"),
                          ("rlm_ratio", "FanDuel moved vs public"),
                          ("rlm", "line moved off the public (no ratio test)"))):
                      sd = r["calls"].get(sig)
                      # don't repeat a market in tier 3 that a stronger tier already showed
                      if sig == "rlm" and (r["calls"].get("pin_rlm") == sd
                                           or r["calls"].get("rlm_ratio") == sd): continue
                      if sd: hits.append((rank, tier, sig, sd, x, r))
              if not hits: return []
              hits.sort(key=lambda h: (h[0], label_of(h[4])))
              L = ["## FLAGGED — reverse line movement with split confirmation", "",
                   "The crowd holds the tickets on the other side, the money on this side is",
                   f"outsized relative to its ticket count (>= {RLM_RATIO_MIN}x), and the number moved",
                   "here anyway. Pinnacle tier first: that is the sharp book moving, not a retail",
                   "book reacting to its own flow.", "",
                   "",
                   "`moved` is **that tier's own book** moving — Pinnacle's number for the Pinnacle",
                   "tier, FanDuel's for the FanDuel tier. `FD now` is what you would be buying.",
                   "This table used to print one book's number next to the other's in one row.", "",
                   "`retraced` is how far Pinnacle's number has already come BACK against the move",
                   "in the `moved` column. `moved` compares first-seen with current, so a number",
                   "that went 136.5 -> 131 -> 135 prints as a drop while it is actually climbing.",
                   "A large `retraced` means the move is finished and reversing, and you would be",
                   "buying the wrong end of it. This is shown, not gated -- it is not a signal.", "",
                   "| tier | game | market | side | book | moved | retraced | FD now | tickets | money/tix | record |",
                   "|---|---|---|---|---|---|---|---|---|---|---|"]
              for _, tier, sig, sd, x, r in hits:
                  s = rec_of(sig)
                  pin = sig == "pin_rlm"
                  book = "Pinnacle" if pin else "FanDuel"
                  # NOT r["open"] -- that is the s0 (home/over) opener, and printing it beside an
                  # away/under flag showed another side's number: Tennessee's moneyline read
                  # "-450 -> 330" (-450 was DALLAS's opener) and Miami's spread read "-17 -> 16.5",
                  # a sign flip. open_side carries the flagged side's own opener; use it.
                  frm = r.get("pin_mv_from") if pin else (r.get("open_side") or {}).get(sd, r.get("open"))
                  to_ = r.get("pin_mv_to") if pin else (r.get("line") or {}).get(sd)
                  tx = r.get("pin_rlm_tix") if pin else (r.get("tix") or {}).get(sd)
                  rt = r.get("pin_rlm_ratio") if pin else r.get("mny_ratio")
                  ln = (r.get("line") or {}).get(sd)
                  # A flagged side whose own number never moved is honest information, not a move:
                  # the signal fired on the OTHER side's price shifting (Pinnacle re-vigging one
                  # side only). Say so rather than printing "139 -> 139" as though it moved.
                  mv = ("" if None in (frm, to_) else
                        f"{frm:g} (other side moved)" if frm == to_ else f"{frm:g} -> {to_:g}")
                  _bo = r.get("pin_bounce")
                  bo = "" if _bo is None else ("—" if _bo < 0.5 else f"**+{_bo:g}**")
                  L.append(f"| {tier} | {label_of(x)} | {x.get('market', r.get('mkt',''))} | {sd} | "
                           f"{book} | {mv} | {bo} | {ln if ln is not None else ''} | "
                           f"{tx}% | {rt} | {s} |")
              L.append("")
              return L


          def board_md(upcoming, summary, gen):
              rec = {(r["signal"], r["market"], r["period"]): r for r in summary
                     if r["slice"] == "all" and r["checkpoint"] == "close"}

              def rec2(sig, mkt):
                  """fit record, then forward record. No "|" -- these go inside table cells."""
                  f_ = rec.get((sig, mkt, "fit")); w_ = rec.get((sig, mkt, "fwd"))
                  return f"{fmt_rec(f_) if f_ else '0-0'} fit · {fmt_rec(w_) if w_ else '0-0'} fwd"

              # WEIGHT BY RECORD, NOT BY HEADCOUNT. This board used to group by "how many
              # signals agree", which treats a 113-90 signal and a 3-8 signal as equal
              # evidence and happily prints "5 signals agree" when four of them lose money.
              # Same fix the NFL board already had: each agreeing signal contributes its own
              # base-rate-corrected edge, shrunk by n/(n+K), and a redundant pair member is
              # dropped so one signal cannot vote twice. Weights come from the FIT period
              # until a signal has MIN_N decided FORWARD outcomes, then from forward.
              W, SUB = {}, {}
              for per in ("fit", "fwd"):
                  for row in summary:
                      if (row["slice"] != "all" or row["checkpoint"] != "close"
                              or row["period"] != per): continue
                      sig, mk = row["signal"], row.get("market")
                      if "+" in sig:
                          if row.get("redundant_with") and mk == "both" and per == "fit":
                              a_, b_ = sig.split("+", 1)
                              SUB[b_ if row["redundant_with"] == a_ else a_] = row["redundant_with"]
                          continue
                      dec_ = row["W"] + row["L"]
                      if per == "fwd" and dec_ < MIN_N:
                          continue
                      W[(sig, mk)] = (round(row.get("edge_pts") or 0.0, 1),
                                      round(row.get("roi_pct") or 0.0, 1), dec_, per)

              def wt(sig, mkt):
                  v = W.get((sig, mkt))
                  if not v or v[2] == 0:
                      v = W.get((sig, "both"))
                  if not v or v[2] == 0:
                      return 0.0
                  e_m, roi_m, n_m, _p = v
                  # WEIGHT BY ROI, NOT BY HIT-RATE EDGE, and require BOTH to be positive.
                  #
                  # Hit-rate edge was the right correction to raw win rate, but it is the wrong
                  # CURRENCY once prices vary. On spreads and totals everything is near -110, so
                  # edge and ROI rank the same and the difference never showed. On moneylines
                  # they come apart completely: money_level on CBB moneylines is 312-113, hit
                  # 73.4% against a 69.8% base rate -- edge +3.6, so it earned positive weight --
                  # while returning -3.5% and -14.87 units, because it is laying -880 favourites.
                  # On 2026-11-17 that ranked a -880 chalk moneyline as the best play on the
                  # board. A signal has to beat its base rate AND make money; ROI alone could be
                  # flattered by a sample where one side simply kept winning, and edge alone is
                  # blind to price, so neither test is dropped.
                  w_ = roi_m if (roi_m <= 0 or e_m >= 0) else 0.0
                  return round(w_ * n_m / (n_m + SHRINK_K), 1) if n_m else 0.0

              def wt_src(sig, mkt):
                  v = W.get((sig, mkt)) or W.get((sig, "both"))
                  return v[3] if v else "fit"

              def score(calls, side, mkt):
                  keep = {g_ for g_ in calls if SUB.get(g_) not in calls}
                  pos = sum(wt(g_, mkt) for g_ in keep if calls[g_] == side)
                  neg = sum(wt(g_, mkt) for g_ in keep if calls[g_] != side)
                  return round(pos - neg, 1)

              def band(sc):
                  # Thresholds doubled with the switch from edge points to ROI %: at -110,
                  # ROI = 1.909p - 1, so a 5-point hit-rate edge is about +9.6% ROI. Same bands,
                  # restated in the new currency.
                  return ("A  weighted ROI >= +20%" if sc >= 20 else
                          "B  weighted ROI +10% to +20%" if sc >= 10 else
                          "C  weighted ROI 0 to +10%" if sc > 0 else
                          "D  no weighted edge (agreement is all unproven or money-losing signals)")

              L = ["# CBB board", "",
                   f"Generated {gen}. Upcoming games with a FanDuel line. Every game is listed;",
                   "nothing is cut.", "",
                   "Ranked by **weighted ROI**: each agreeing signal contributes its own return per",
                   f"unit risked, and contributes nothing until it has {MIN_N} decided outcomes. A",
                   "signal earns positive weight only if it **both** beats its own base rate and",
                   "makes money. Hit-rate edge alone is blind to price — `money_level` on CBB",
                   "moneylines beats its base rate by 3.6 points while returning −3.5%, because it",
                   "lays −880 favourites, and on 2026-11-17 that ranked a −880 chalk first here.",
                   "Raw agreement count is shown too, but it is the weaker number — a",
                   "market can have five signals agreeing where four have losing records.", "",
                   "**SPLIT** marks a market where at least two signals point each way. Those average",
                   "to a weak score and land in band D looking empty, when our inputs are in",
                   "conflict — often the markets worth the most attention. They sort first inside",
                   "whatever band they fall in.", "",
                   "Each call shows **two** records: `fit` (games the signal was chosen on, before",
                   f"{HOLDOUT_FROM} — a good number there proves nothing) and `fwd` (games since,",
                   "which it had no hand in choosing). A `*` means the weight came from the forward",
                   f"record, which happens once that record reaches {MIN_N} decided outcomes.", "",
                   "This is analysis, not picks.", ""]
              flat = [{"game": g.get("game") or g.get("key"), "market": mkt, "now": mm["now"]}
                      for g in upcoming for mkt, mm in g["markets"].items() if mm.get("now")]
              L += flagged_md(flat, summary, lambda sig: rec2(sig, "both"), lambda x: x["game"])
              groups = collections.defaultdict(list)
              for g in upcoming:
                  for mkt, m in g["markets"].items():
                      r = m["now"]
                      calls = r["calls"]
                      if not calls: continue
                      tally = collections.Counter(calls.values())
                      side, n = tally.most_common(1)[0]
                      sc = score(calls, side, mkt)
                      # SPLIT: signals pointing opposite ways average to a weak score and sink to
                      # band D looking empty, when our own inputs are actually in conflict. Marked
                      # and sorted first within its band. See the NFL grader for the case that
                      # prompted it (IND@HOU 2026-11-19).
                      opp = len(calls) - n
                      groups[band(sc)].append((g, mkt, r, side, sc, n, opp, n >= 2 and opp >= 2))
              for b in sorted(groups):
                  L += [f"## {b}", "",
                        "| tip (ET) | game | market | lean | wt ROI | raw | FD now | open | Pin | "
                        "tix / money (lean side) | bets | calls |",
                        "|---|---|---|---|---|---|---|---|---|---|---|---|"]
                  for g, mkt, r, side, sc, nag, nag_ag, split in sorted(
                          groups[b], key=lambda x: (not x[7], -x[4], x[0]["tip"])):
                      tip = (dt.datetime.fromisoformat(g["tip"].replace("Z", "+00:00"))
                             - dt.timedelta(hours=5)).strftime("%a %H:%M")
                      parts = []
                      for sig, sd in r["calls"].items():
                          parts.append(f"{sig}->{sd} ({rec2(sig, mkt)}"
                                       + ("*)" if wt_src(sig, mkt) == "fwd" else ")"))
                      pv = (r.get("pin_side") or {}).get(side, r.get("pin"))
                      pin = (f"{pv:g} (${r['pin_lim']:,.0f})"
                             if pv is not None and r.get("pin_lim") else "")
                      # Flag a Pinnacle move that has already retraced against itself. Appended to
                      # the Pin cell rather than given a column -- this table is wide enough, and
                      # the note only wants the eye when there is something to see.
                      _bo = r.get("pin_bounce")
                      if pin and _bo is not None and _bo >= 1.0:
                          pin += f" **retraced +{_bo:g}**"
                      ov = (r.get("open_side") or {}).get(side, r.get("open"))
                      op = f"{ov:g}" if ov is not None else ""
                      odds = f" ({r['odds'][side]:+d})" if r["odds"][side] is not None else ""
                      tm = (f"{r['tix'][side]}% / {r['mny'][side]}%" if r["tix"][side] is not None
                            and r["mny"][side] is not None else "")
                      L.append(f"| {tip} | {g['game']} | {mkt} | "
                               f"{side}{' **SPLIT**' if split else ''} | {sc:+g} | {nag}-{nag_ag} | "
                               f"{r['line'][side]:g}{odds} | "
                               f"{op} | {pin} | {tm} | {r['nb'] or ''} | "
                               f"{'; '.join(parts)} |")
                  L.append("")
              if not groups: L.append("No upcoming games with signals yet.")
              return "\n".join(L) + "\n"



          if __name__ == "__main__":
              print_idea_register()
              graded, upcoming, unmatched = build()
              brs = {p_: base_rates(graded, None if p_ == "all" else p_)
                     for p_ in ("all", "fit", "fwd")}
              br = brs["all"]
              summary = summarize(graded, brs)
              gen = now_utc().strftime("%Y-%m-%d %H:%M UTC")
              nfit = sum(1 for g in graded if period_of(g) == "fit")
              os.makedirs(C("graded"), exist_ok=True)
              json.dump(graded, open(C("graded", "games.json"), "w"), indent=1)
              json.dump({"generated": gen, "graded_games": len(graded), "unmatched_finals": unmatched,
                         "min_n_to_propose": MIN_N, "holdout_from": HOLDOUT_FROM,
                         "fit_games": nfit, "forward_games": len(graded) - nfit,
                         "base_rates": brs, "signals": summary},
                        open(C("graded", "summary.json"), "w"), indent=1)
              open(C("SCORECARD.md"), "w").write(scorecard_md(summary, graded, unmatched, brs, gen))
              open(C("BOARD.md"), "w").write(board_md(upcoming, summary, gen))
              print(f"graded games: {len(graded)}   upcoming on board: {len(upcoming)}   "
                    f"finished but no final matched: {unmatched}")
              print(f"holdout {HOLDOUT_FROM}: {nfit} fit games, {len(graded)-nfit} forward games")
              for per in ("fwd", "fit"):
                  rows = [r for r in summary
                          if r["slice"] == "all" and r["market"] == "both" and r["period"] == per
                          and ("+" not in r["signal"] or (r["W"] + r["L"]) >= 40)]
                  print(f"--- {per.upper()} ---" + ("  (empty -- starts at next tip)"
                                                    if not rows else ""))
                  for r in rows:
                      print(f"  {r['checkpoint']:5} {r['signal']:13} {fmt_rec(r):>9}  hit {r['hit_pct']}"
                            f"  exp {r.get('expected_pct')}  edge {r.get('edge_pts')}"
                            f"  roi {r['roi_pct']}  clv {r.get('clv_avg', '-')}  {r['proposal']}")

          PY
      - name: commit
        run: |
          git config user.name propwatch
          git config user.email propwatch@users.noreply.github.com
          git add cbb/graded cbb/SCORECARD.md cbb/BOARD.md
          git diff --staged --quiet && exit 0
          git commit -q -m "grade-cbb $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase --autostash && git push -q && exit 0
            sleep 9
          done
          exit 1
