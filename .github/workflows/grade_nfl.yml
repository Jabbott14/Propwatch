name: grade-nfl

# Propwatch NFL grader + board. Rebuilt from the raw archive every run; writes:
#   nfl/graded/games.json    every finished game, the system's read at two checkpoints
#   nfl/graded/summary.json  each signal's record: W-L, ROI, CLV, base-rate-corrected edge
#   nfl/SCORECARD.md         the same, readable on GitHub
#   nfl/BOARD.md             upcoming games: what each signal says, beside its record
#
# Namespaced under nfl/ so it cannot clobber the candidates/ freeze written by grade.yml.

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade-nfl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Shallow clone, like the other seven workflows. fetch-depth: 0 pulled the whole
      # history -- 366 MB and growing ~16 MB/day -- on every run, eight times a day, to
      # read files that are all present at HEAD. Nothing here reads git history.
      - uses: actions/checkout@v4

      - name: Grade and build the board
        run: |
          python3 - . <<'PY'


          #!/usr/bin/env python3
          """Propwatch NFL grader + board. Stdlib only. Runs on a GitHub Actions runner.

          Ported from grade_cbb.yml, which got the architecture right. Every run it rebuilds,
          from the collector's raw archive:

            graded/games.json      every finished game: the system's read at two checkpoints
                                   (EARLY = first hour after the line was first seen, CLOSE =
                                   last number before kickoff) and how each signal did.
            graded/summary.json    each signal's record: W-L, hit %, ROI at the actual price,
                                   closing-line value, base-rate-corrected edge, split by
                                   ticket volume and Pinnacle limit.
            SCORECARD.md           the same, readable on GitHub.
            BOARD.md               upcoming games: what each signal says now, next to that
                                   signal's graded record so far.

          Nothing here is a bet. It grades what every signal said on every game, so the record
          is complete whether or not anyone bet. It never changes its own rules: it reports
          which signals are earning and proposes changes once a signal has MIN_N decided games.
          A person approves the change.

          Reads are built only from rows timestamped BEFORE kickoff, so history has no look-ahead.

          TWO GATES (the 2026-11-09 BUF@MIN lesson, logged as fault 4 in
          claude/propwatch-news-vs-coherence.md). EV against Pinnacle can essentially never be
          positive, because Pinnacle IS the fair-value definition: any true signal that has not
          yet fully moved the market still prices at roughly minus-the-vig against it. So:

            Gate B  -- the SIGNALS below. Directional: is informed money on a side? This is the
                       gate that decides WHETHER to play. Graded here by CLV and hit rate.
            Gate A  -- `pin_gap` / `pin_lim` columns. Where to buy it, and a price FLOOR.
                       A floor, not a veto. It must never overrule a Gate B signal over a
                       couple of points of vig.

          On 2026-11-09 Gate B fired on the under (line fell 46.5 -> 45.5 while over tickets
          went 54% -> 72%) and on Buffalo. Gate A read -3.7% and -2.7%. Gate A won. The game
          landed 23-6, total 29. That is what these two gates exist to prevent.

          Signals (each picks a side of the spread or the total):
            follow_move   the side the line has moved toward since first seen
            rlm           reverse line movement: the line moved toward the side the PUBLIC IS
                          NOT on. Justin's stated template -- "jags have a bunch of public bets
                          and money and the line moves towards BAL -> sharp signal on Bal".
                          This is the signal that was missing on 2026-11-09.
            money_level   the side with the larger share of money
            sharp_gap     the side whose money% most exceeds its tickets%
            money_moving  the side whose money% rose faster than its tickets% since first seen
            pin_value     the side FanDuel prices better than Pinnacle (Pinnacle = fair value)
          """
          import gzip, itertools, json, os, re, sys, glob, math, collections, datetime as dt

          REPO = sys.argv[1] if len(sys.argv) > 1 else "."
          C = lambda *a: os.path.join(REPO, "nfl", *a)      # outputs, namespaced like cbb/
          R = lambda *a: os.path.join(REPO, *a)             # the raw archive, at the repo root
          FD = 69
          EARLY_MIN = 60
          MIN_N = 30
          SHRINK_K = 25         # a signal's edge is shrunk toward zero by n/(n+K)
          BREAKEVEN = 0.524            # -110
          PUBLIC_MIN = 60              # tickets% needed before a side counts as "the public side"
          SIGNALS = ("rlm_quiet", "pin_move", "money_delta",
                     "pin_rlm", "pre_move", "follow_move", "rlm", "rlm_ratio", "money_level",
                     "sharp_gap", "money_moving", "pin_value", "book_lag", "consensus_gap")
          # rlm_ratio is the conjunction, not a single variable. Measured on 1,862 CBB
          # side-observations: a minority-ticket side wins 42.9% on its own and 37.6% if you add a
          # high money/ticket ratio WITHOUT line confirmation -- i.e. "few tickets, big money" is a
          # LOSING pattern by itself. Require that the line moved toward it anyway and the same
          # population goes to 52.7%, a ~14 point swing. That is the whole mechanism: the ratio
          # means nothing until the number moves against the crowd to confirm it.
          RLM_TIX_MAX = 45      # that side holds under this share of tickets
          RLM_MNY_MAX = 45      # rlm_quiet: ...and under this share of money too
          RLM_RATIO_MIN = 1.2   # its money share is at least this multiple of its ticket share
          # ---------------------------------------------------------------------------
          # CHANGES, NOT STATES. Measured 2026-11-19 across 2,950 CBB markets where some
          # signal fired, every state variable came back flat and every derivative carried
          # information:
          #   money LEVEL (peak >=95% of handle) ... 53.4%, a coin flip
          #   money RISING (into a <50% ticket side) 57.1%, n=399
          #   Pinnacle's POSITION vs FanDuel ....... no order at all across five buckets:
          #                                          >=+1.0 pt -5.2%, same -3.5%, <=-1.0 -1.8%
          #   Pinnacle MOVING ...................... orders outcomes at every level of
          #                                          what FanDuel did
          #   line UNMOVED ......................... -9.4%
          #   line ALREADY MOVED 2+ pts ............ -2.3%
          # The engine was built almost entirely on states -- money_level, sharp_gap and
          # pin_value all read a snapshot at a checkpoint, and the one change-based signal,
          # follow_move, reads FANDUEL's change, the book whose direction does not matter.
          # These two signals read the changes that do.
          PIN_MOVE_MIN = 0.5    # points Pinnacle's own number must have travelled
          MONEY_DELTA_MIN = 5   # points of money share a side must have GAINED
          MONEY_DELTA_TIX_MAX = 50   # ...while still holding under this share of tickets
          # ---------------------------------------------------------------------------
          # pre_move is rlm_ratio's mirror image and the system's stated goal stated as a signal:
          # the money is on the minority-ticket side at an outsized ratio and the number has NOT
          # moved yet. rlm_ratio pays you for recognising a move that already happened; pre_move
          # claims the move is still coming. It is the harder and more valuable claim, and until
          # now it has only ever been eyeballed into a card by hand -- never graded. CLV is the
          # direct test of it: if the thesis is right, the number should come to you.
          # pin_rlm is the strongest form of the same idea. `rlm` and `rlm_ratio` read FanDuel's
          # own number moving, which is a retail book reacting to its own flow. pin_rlm requires
          # PINNACLE -- the book taking $75k a side and not limiting winners -- to have moved its
          # number toward the side the public is NOT on. That is the sharp book repricing against
          # the crowd, confirmed by the splits. Only measurable since Pinnacle went to every-cycle
          # sampling (2026-11-12): before that it was observed once an hour against FanDuel's ten
          # minutes, so most Pinnacle moves were invisible.
          LAG_BOOKS = 5        # of 8 SBR books that must have moved before FanDuel counts as stale
          # ---------------------------------------------------------------------------
          # HOLDOUT. Every signal in this file, every threshold in it, and every
          # PROMOTE/DROP label the scorecard has ever printed was chosen while looking at
          # games that kicked off before this date. Measuring those choices on the same
          # games is grading the exam you studied from: pin_value was 108-68 in CBB first
          # halves and 10-1 on NFL spreads, and both of those numbers were fitted and
          # scored on one sample. So every record below is reported twice --
          #   fit  games before HOLDOUT_FROM. In-sample. A label here is a HYPOTHESIS.
          #   fwd  games on or after it. Out-of-sample. A label here is EVIDENCE.
          # Nothing may be added to the fit period. If a threshold is ever changed, this
          # date moves forward to the day of the change and the forward test restarts --
          # that is the whole point, and it is the only cost of fiddling with the engine.
          # Bumped 2026-11-19 when pin_move and money_delta were added. Adding a signal is
          # exactly the change this date exists to charge for: games through 2026-11-19 are
          # the window those two were designed in, so they are fit, not evidence.
          HOLDOUT_FROM = "2026-11-21"
          # ---------------------------------------------------------------------------
          # NFL volumes run 2k-120k bets a game, and Pinnacle NFL limits run $3k-$75k.
          NB_BUCKETS = ((0, 10000, "<10k bets"), (10000, 40000, "10-40k bets"), (40000, 10**9, "40k+ bets"))
          LIM_BUCKETS = ((0, 10000, "pin limit <$10k"), (10000, 50000, "pin $10-50k"),
                         (50000, 10**9, "pin $50k+"))
          SIDES = {"spread": ("home", "away"), "total": ("over", "under"),
                   "moneyline": ("home", "away"),
                   "tt_home": ("over", "under"), "tt_away": ("over", "under")}
          MARKETS = ("spread", "total", "moneyline", "tt_home", "tt_away")
          AN_TT = "core_bet_type_6_team_score"   # Action Network's team-total block


          def dec(p): return (100 / -p + 1) if p < 0 else (p / 100 + 1)
          def imp(p): return 1 / dec(p) if p else None


          def now_utc(): return dt.datetime.now(dt.timezone.utc)
          def tsfmt(t): return t.strftime("%Y-%m-%dT%H%MZ")
          def parse_ts(s): return dt.datetime.strptime(s, "%Y-%m-%dT%H%MZ").replace(tzinfo=dt.timezone.utc)


          def iso_dt(s):
              try: return dt.datetime.fromisoformat(str(s).replace("Z", "+00:00"))
              except Exception: return None


          def snap_ts(path):
              """raw/<src>/<date>/2026-11-09T2238Z.json.gz -> 2026-11-09T2238Z"""
              return os.path.basename(path).split(".")[0]


          def jgz(p):
              o = gzip.open if p.endswith(".gz") else open
              with o(p, "rt") as f:
                  return json.load(f)


          # ------------------------------------------------------------------ load
          def load():
              """Walk the raw archive. NFL keeps whole API responses, not a flattened layer, so
              this does the flattening the CBB collector does at write time."""
              ser = collections.defaultdict(list)      # (gid, mkt, side) -> [(t, v, o, tx, mn, nb)]
              games, finals = {}, {}
              for p in sorted(glob.glob(R("raw", "actionnet", "*", "*.json*"))):
                  try: d = jgz(p)
                  except Exception: continue
                  t = snap_ts(p)
                  for g in (d.get("games") or []):
                      gid = str(g.get("id"))
                      tm = {x.get("id"): x for x in (g.get("teams") or [])}
                      home = (tm.get(g.get("home_team_id")) or {}).get("full_name")
                      away = (tm.get(g.get("away_team_id")) or {}).get("full_name")
                      ko = g.get("start_time")
                      if not (gid and home and away and ko): continue
                      games.setdefault(gid, {
                          "gid": gid, "game": f"{away} @ {home}", "home_name": home, "away_name": away,
                          "home_abbr": (tm.get(g.get("home_team_id")) or {}).get("abbr"),
                          "away_abbr": (tm.get(g.get("away_team_id")) or {}).get("abbr"),
                          "kickoff": ko, "week": g.get("week")})
                      # final score, straight off the boxscore -- no separate finals feed to join
                      if g.get("status") in ("complete", "final") and gid not in finals:
                          ls = ((g.get("boxscore") or {}).get("linescore")) or []
                          if ls:
                              finals[gid] = {"as": sum(q.get("away_points") or 0 for q in ls),
                                             "hs": sum(q.get("home_points") or 0 for q in ls)}
                      bm = (g.get("markets") or {}).get(str(FD)) or {}
                      ev = bm.get("event") or {}
                      nb = g.get("num_bets")
                      for mkt in ("spread", "total", "moneyline"):
                          for o in (ev.get(mkt) or []):
                              if o.get("is_live") or o.get("period") not in (None, "event"): continue
                              side = o.get("side")
                              if side not in SIDES[mkt]: continue
                              bi = o.get("bet_info") or {}
                              # a moneyline has no handicap -- its price IS its line
                              val = o.get("odds") if mkt == "moneyline" else o.get("value")
                              ser[(gid, mkt, side)].append(
                                  (t, val, o.get("odds"),
                                   (bi.get("tickets") or {}).get("percent"),
                                   (bi.get("money") or {}).get("percent"), nb))
                      # team totals sit in their own block and carry splits like any other market
                      for o in (ev.get(AN_TT) or []):
                          if o.get("is_live") or o.get("period") not in (None, "event"): continue
                          side = o.get("side")
                          if side not in ("over", "under") or o.get("value") is None: continue
                          al = ("home" if o.get("team_id") == g.get("home_team_id")
                                else "away" if o.get("team_id") == g.get("away_team_id") else None)
                          if not al: continue
                          bi = o.get("bet_info") or {}
                          ser[(gid, "tt_" + al, side)].append(
                              (t, o.get("value"), o.get("odds"),
                               (bi.get("tickets") or {}).get("percent"),
                               (bi.get("money") or {}).get("percent"), nb))
              for v in ser.values():
                  v.sort()
                  # collapse duplicate timestamps, keep last
                  seen = {}
                  for row in v: seen[row[0]] = row
                  v[:] = [seen[k] for k in sorted(seen)]

              # Pinnacle: matchups name the game, prices carry the numbers. Same snapshot stamp.
              pin = collections.defaultdict(list)      # gid-agnostic key (home,away,kickoff-hour) -> rows
              mfiles = {snap_ts(p): p for p in glob.glob(R("raw", "pin_matchups", "*", "*.json*"))}
              for t, mp in sorted(mfiles.items()):
                  pp = None
                  for cand in glob.glob(R("raw", "pin_prices", "*", t + ".json*")):
                      pp = cand; break
                  if not pp: continue
                  try: M, P = jgz(mp), jgz(pp)
                  except Exception: continue
                  byid = {}
                  for m in (M if isinstance(M, list) else []):
                      if m.get("parentId") is not None: continue
                      ps = {p.get("alignment"): p.get("name") for p in (m.get("participants") or [])}
                      ko = iso_dt(m.get("startTime"))
                      if ps.get("home") and ps.get("away") and ko:
                          byid[m.get("id")] = (ps["home"], ps["away"], ko)
                  for r in (P if isinstance(P, list) else []):
                      k = byid.get(r.get("matchupId"))
                      if not k or r.get("isAlternate"): continue
                      key = r.get("key") or ""
                      if key.startswith("s;0;s;"): ty = "spread"
                      elif key.startswith("s;0;ou"): ty = "total"
                      elif key == "s;0;m": ty = "moneyline"
                      elif key.startswith("s;0;tt;"):
                          al = key.rsplit(";", 1)[-1]
                          if al not in ("home", "away"): continue
                          ty = "tt_" + al
                      else: continue
                      lim = max([l.get("amount", 0) for l in (r.get("limits") or [])] or [0])
                      for pr in (r.get("prices") or []):
                          d_ = pr.get("designation")
                          if d_ not in SIDES[ty]: continue
                          pts = pr.get("price") if ty == "moneyline" else pr.get("points")
                          pin[k].append((t, ty, d_, pts, pr.get("price"), lim))
              for v in pin.values(): v.sort()
              return games, ser, pin, finals


          def load_sbr_openers():
              """The TRUE market opener, from SportsbookReview's archived page.

              Until now `open` was the first value in OUR archive, which for a Sunday slate meant
              the previous Tuesday's number, not the opener. Measured against SBR on 2026-11-11:
              19 of 28 games had a different opener, mean absolute error 0.71 points, worst 3.0
              (TEN@CIN opened -10.5, our archive said -13.5). Both `follow_move` and `rlm` derive
              their DIRECTION from the opener, so a wrong opener does not just scale the move --
              it can reverse it.

              SBR's archived page is the SPREAD view only: homeOdds is the juice on the spread,
              not a moneyline, and total is null throughout. So totals AND moneylines have no true
              opener here; both fall back to first-seen, flagged `open_src: "first_seen"`.
              """
              out, cur = {}, collections.defaultdict(dict)
              for p in sorted(glob.glob(R("raw", "sbr", "*", "*"))):
                  t = os.path.basename(p).split(".")[0]
                  try:
                      o = gzip.open if p.endswith(".gz") else open
                      with o(p, "rt", errors="replace") as fh: txt = fh.read()
                      m = re.search(r"__NEXT_DATA__[^>]*>(\{.*?\})</script>", txt, re.S)
                      if not m: continue
                      d = json.loads(m.group(1))
                  except Exception:
                      continue
                  for tb in (d.get("props", {}).get("pageProps", {}).get("oddsTables") or []):
                      for gr in (tb.get("oddsTableModel", {}).get("gameRows") or []):
                          gv = gr.get("gameView") or {}
                          a = (gv.get("awayTeam") or {}).get("fullName")
                          h = (gv.get("homeTeam") or {}).get("fullName")
                          ol = ((gr.get("openingLineViews") or [{}])[0] or {}).get("openingLine") or {}
                          if not (a and h): continue
                          k = f"{a} @ {h}"
                          rec = out.setdefault(k, {})
                          if ol.get("homeSpread") is not None: rec.setdefault("spread", ol["homeSpread"])
                          if ol.get("total") is not None:      rec.setdefault("total", ol["total"])
                          # NOT ol["homeOdds"] for the moneyline. This page is the SPREAD view:
                          # every row carries homeSpread with homeOdds beside it as the JUICE ON
                          # THAT SPREAD, and total is null throughout. Reading homeOdds as a
                          # moneyline opener gave every NFL game an "opening moneyline" of -110,
                          # -108 or -112 -- KC@ATL stored 100 while Pinnacle actually ran
                          # 170 -> 160 -- so follow_move fired 41 times on moneylines measuring
                          # a price move against a spread's vig. SBR has no moneyline opener in
                          # this scrape, so moneylines fall back to first-seen (a real moneyline
                          # price) and say so via open_src, same as totals already did.
                          # every book's CURRENT number at this snapshot, for consensus and lag
                          snap = {}
                          for ov in (gr.get("oddsViews") or []):
                              if not ov: continue
                              bk = ov.get("sportsbook") or str(ov.get("sportsbookId"))
                              cl = ov.get("currentLine") or {}
                              op = ov.get("openingLine") or {}
                              snap[bk] = {"spread": cl.get("homeSpread"), "total": cl.get("total"),
                                          "moneyline": cl.get("homeOdds"),
                                          "o_spread": op.get("homeSpread"), "o_total": op.get("total"),
                                          "o_moneyline": op.get("homeOdds")}
                          if snap: cur[k][t] = snap
              return out, cur


          def match_pin(g, pin_keys):
              """NFL names are identical between Action Network and Pinnacle, so this is an exact
              match on both full names plus a kickoff inside 3 hours. No fuzzy matching needed --
              and per engine defect 7, never match on a team name alone: a team appears on two
              boards at once for half the week."""
              ko = iso_dt(g["kickoff"])
              if not ko: return None
              for k in pin_keys:
                  h, a, pk = k
                  if h == g["home_name"] and a == g["away_name"] and abs((pk - ko).total_seconds()) <= 10800:
                      return k
              return None


          # ------------------------------------------------------------------ reads
          def at(series, t):
              """last row at or before t (series sorted), else None"""
              out = None
              for row in series:
                  if row[0] <= t: out = row
                  else: break
              return out


          def pin_at(prow, ty, desig, t):
              out = None
              for row in prow:
                  if row[0] > t: break
                  if row[1] == ty and row[2] == desig: out = row
              return out


          def book_read(books, mkt, t, fd_line, fd_open, s0, s1):
              """Cross-book consensus and lag from SBR's 8 books. No splits involved.

              consensus_gap  FanDuel's number is off the 8-book median -- take the side FanDuel
                             is giving away.
              book_lag       at least LAG_BOOKS of them have moved off their own opener in one
                             direction and FanDuel has NOT. FanDuel's number is stale and about to
                             follow, so the side they moved toward is available cheap. This is the
                             literal form of "find lines before they move", and it only works if
                             SBR is sampled at the same cadence as FanDuel.
              """
              if not books: return {}, {}
              ks = [k for k in books if k <= t]
              if not ks: return {}, {}
              snap = books[max(ks)]
              vals = [b.get(mkt) for b in snap.values() if b.get(mkt) is not None]
              if len(vals) < 4: return {}, {}
              vals.sort()
              med = vals[len(vals) // 2] if len(vals) % 2 else (vals[len(vals)//2 - 1] + vals[len(vals)//2]) / 2
              calls, info = {}, {"books": len(vals), "median": med,
                                 "spread_of_books": round(vals[-1] - vals[0], 1)}
              if fd_line is not None and fd_line != med:
                  if mkt == "spread":      calls["consensus_gap"] = s0 if fd_line > med else s1
                  elif mkt == "total":     calls["consensus_gap"] = s1 if fd_line > med else s0
                  else:
                      i_fd, i_md = imp(fd_line), imp(med)
                      if i_fd and i_md: calls["consensus_gap"] = s1 if i_fd > i_md else s0
                  info["fd_vs_median"] = round(fd_line - med, 1) if mkt != "moneyline" else None
              up = dn = 0
              for b in snap.values():
                  c, o = b.get(mkt), b.get("o_" + mkt)
                  if c is None or o is None or c == o: continue
                  up += c > o; dn += c < o
              info["books_up"], info["books_dn"] = up, dn
              fd_moved = fd_line is not None and fd_open is not None and fd_line != fd_open
              if not fd_moved and max(up, dn) >= LAG_BOOKS and min(up, dn) == 0:
                  d = 1 if up > dn else -1
                  if mkt == "spread":    calls["book_lag"] = s1 if d > 0 else s0
                  elif mkt == "total":   calls["book_lag"] = s0 if d > 0 else s1
                  else:                  calls["book_lag"] = s0 if d > 0 else s1
              return calls, info


          def read(gid, mkt, t, ser, prow, true_open=None, books=None):
              """The system's read on one market at time t. None if no FanDuel line yet."""
              s0, s1 = SIDES[mkt]
              A, B = ser.get((gid, mkt, s0), []), ser.get((gid, mkt, s1), [])
              a, b = at(A, t), at(B, t)
              if not a or not b or a[1] is None or b[1] is None: return None
              f0 = next((x for x in A if x[1] is not None), None)      # first line seen = our opener
              fa = next((x for x in A if x[3] is not None), None)       # first with splits
              fb = next((x for x in B if x[3] is not None), None)
              r = {"t": a[0], "nb": a[5], "line": {s0: a[1], s1: b[1]}, "odds": {s0: a[2], s1: b[2]},
                   "tix": {s0: a[3], s1: b[3]}, "mny": {s0: a[4], s1: b[4]},
                   "open": f0[1] if f0 else None, "first_seen": f0[0] if f0 else None,
                   "open_src": "first_seen", "calls": {}}
              if true_open is not None:
                  r["open"], r["open_src"] = true_open, "sbr_open"
              # Both sides of the opener. read() works off the s0 (home/over) series and the
              # board prints those scalars beside whichever side the lean is on, so an away
              # lean was shown the HOME opening number. Same family as pin_side and the FLAGGED
              # table's two-book row.
              _g0 = next((x for x in B if x[1] is not None), None)
              r["open_side"] = {s0: r["open"],
                                s1: (-r["open"] if (mkt == "spread" and r["open"] is not None)
                                     else r["open"] if mkt in ("total", "tt_home", "tt_away")
                                     else (_g0[1] if _g0 else None))}


              # --- money_delta: the money share on a side has RISEN, while that side still holds
              #     a ticket minority. Level is a coin flip (a side peaking above 95% of the
              #     handle covers 53.4% of the time); the DIRECTION is what carries -- money
              #     rising into a 35-50% ticket side ran 57.1% over 399 markets, and money rising
              #     into a MAJORITY ticket side ran 44.9%, the worst cell measured. So the ticket
              #     cap is not decoration: without it this signal inverts.
              #     Baseline is the first reading with real splits, never the 0/0 placeholder the
              #     feed serves before any money is in -- that placeholder is what made
              #     money_moving a duplicate of sharp_gap.
              _b0 = next((x for x in A if x[3] not in (None, 0)), None)
              _b1 = next((x for x in B if x[3] not in (None, 0)), None)
              for _sd, _now, _base in ((s0, a, _b0), (s1, b, _b1)):
                  if not _base or _now[4] is None or _base[4] is None or _now[3] is None: continue
                  _d = _now[4] - _base[4]
                  if _d >= MONEY_DELTA_MIN and _now[3] < MONEY_DELTA_TIX_MAX:
                      prev = r.get("money_delta_pts")
                      if prev is None or _d > prev:
                          r["money_delta_pts"] = round(_d, 1)
                          r["calls"]["money_delta"] = _sd
              # --- follow_move. spread: s0 (home) value FALLING = market moving toward home.
              #     total: value RISING = moving toward over.
              #     moneyline: no handicap, so the move is in PRICE -- the side whose implied
              #     probability rose is the side the market moved toward.
              moved_to = None
              if r["open"] is not None and a[1] != r["open"]:
                  if mkt == "moneyline":
                      i_now, i_open = imp(a[1]), imp(r["open"])
                      if i_now is not None and i_open is not None and i_now != i_open:
                          moved_to = s0 if i_now > i_open else s1
                          r["move_pts"] = round(100 * abs(i_now - i_open), 1)   # points of implied %
                  else:
                      up = a[1] > r["open"]
                      moved_to = (s1 if up else s0) if mkt == "spread" else (s0 if up else s1)
                      r["move_pts"] = round(abs(a[1] - r["open"]), 1)
                  if moved_to: r["calls"]["follow_move"] = moved_to

              # --- rlm. The line moved toward the side the public is NOT on.
              #     This is the 2026-11-09 signal: over tickets 54% -> 72%, total 46.5 -> 45.5,
              #     so the public side is `over` and the line moved to `under` -> call under.
              if moved_to and None not in (a[3], b[3]):
                  tix = {s0: a[3], s1: b[3]}
                  pub = max(tix, key=lambda k: tix[k])
                  if tix[pub] >= PUBLIC_MIN and pub != moved_to:
                      r["calls"]["rlm"] = moved_to
                      r["public_side"] = pub
                      r["public_tix"] = tix[pub]
                  # the stricter conjunction: the side the line moved toward holds a small share of
                  # TICKETS but an outsized share of MONEY, i.e. few bets carrying real size, and
                  # the number moved to them anyway.
                  mny = {s0: a[4], s1: b[4]}
                  t_, m_ = tix.get(moved_to), mny.get(moved_to)
                  if t_ and m_ is not None:
                      ratio = m_ / t_
                      r["mny_ratio"] = round(ratio, 2)
                      if t_ < RLM_TIX_MAX and ratio >= RLM_RATIO_MIN:
                          r["calls"]["rlm_ratio"] = moved_to

                      # --- rlm_quiet: Justin's thesis, instrumented rather than argued about.
                      #     The number moves toward a side holding a MINORITY of tickets AND a
                      #     MINORITY of money. rlm_ratio explicitly excludes this case (it wants
                      #     money/tix >= 1.2), so the engine had no record of it and it kept getting
                      #     re-litigated in chat from whichever in-sample cut was handy.
                      #     The claim: if the book moves a number when neither ticket count nor
                      #     handle is forcing it, the little money that did arrive was respected
                      #     money. A first in-sample pass over 671 CBB games read 22-39 pooled, but
                      #     that is one cut at n=61 and this project's own rule is that in-sample
                      #     numbers are hypotheses. It gets a forward record like everything else,
                      #     and the forward record decides it. Cross-sport confirmation is the point
                      #     of carrying it in NFL too.
                      if t_ < RLM_TIX_MAX and m_ < RLM_MNY_MAX:
                          r["calls"]["rlm_quiet"] = moved_to
                          r["rlm_quiet_tix"] = t_
                          r["rlm_quiet_mny"] = m_

              # --- pre_move: money is on the minority-ticket side at an outsized ratio and the
              #     number has NOT moved yet. The claim is that the move is still to come, which
              #     is the opposite of rlm_ratio and is what "get the line before it moves" means.
              if None not in (a[3], b[3], a[4], b[4]) and r.get("open") is not None:
                  line_static = (a[1] == r["open"])
                  for sd_, t_, m_ in ((s0, a[3], a[4]), (s1, b[3], b[4])):
                      if not t_: continue
                      if line_static and t_ < RLM_TIX_MAX and (m_ / t_) >= RLM_RATIO_MIN:
                          r["calls"]["pre_move"] = sd_
                          r["pre_move_tix"] = t_
                          r["pre_move_ratio"] = round(m_ / t_, 2)

              if a[4] is not None and b[4] is not None and a[4] != b[4]:
                  r["calls"]["money_level"] = s0 if a[4] > b[4] else s1
              if None not in (a[3], a[4], b[3], b[4]):
                  ga, gb = a[4] - a[3], b[4] - b[3]
                  if max(ga, gb) > 0 and ga != gb:
                      r["calls"]["sharp_gap"] = s0 if ga > gb else s1
                  r["gap"] = {s0: ga, s1: gb}
              if fa and fb and None not in (a[3], a[4], b[3], b[4]) and fa[0] < a[0]:
                  da = (a[4] - fa[4]) - (a[3] - fa[3])
                  db = (b[4] - fb[4]) - (b[3] - fb[3])
                  if max(da, db) > 0 and da != db:
                      r["calls"]["money_moving"] = s0 if da > db else s1
                  r["div"] = {s0: da, s1: db}

              bc, bi = ((({}, {})) if mkt.startswith("tt_")
                        else book_read(books, mkt, t, a[1], r["open"], s0, s1))
              r["calls"].update(bc)
              if bi: r["books"] = bi

              # --- Gate A. Pinnacle's number and the size it will take. A floor, never a veto.
              if prow:
                  p = pin_at(prow, mkt, s0, t)
                  if p and p[3] is not None:
                      # Pinnacle's number for BOTH sides. r["pin"] is the s0 (home/over) side,
                      # and the board prints it beside whichever side the lean is on -- for an
                      # away moneyline lean that showed Pinnacle's HOME price, so SPC@MASSL read
                      # "FD +176, Pin -218" as if FanDuel were offering a dog price on a side
                      # Pinnacle had at -218. Same side-confusion as the FLAGGED table printed
                      # with two books; third instance of this family. Store the other side too
                      # and let the board pick the one it is actually talking about.
                      r["pin"], r["pin_price"], r["pin_lim"] = p[3], p[4], p[5]
                      _q = pin_at(prow, mkt, s1, t)
                      r["pin_side"] = {s0: p[3],
                                       s1: (_q[3] if _q and _q[3] is not None else
                                            (-p[3] if mkt == "spread" else
                                             p[3] if mkt in ("total", "tt_home", "tt_away")
                                             else None))}
                      q = pin_at(prow, mkt, s1, t)
                      if q and q[4] is not None: r["pin_price_other"] = q[4]
                      if mkt == "moneyline":
                          # no handicap: take the side whose FanDuel price beats Pinnacle's no-vig fair
                          po, pu = imp(p[3]), imp(q[4] if q else None)
                          if po and pu:
                              fair0 = po / (po + pu)
                              e0 = fair0 * dec(a[2]) - 1 if a[2] else -9
                              e1 = (1 - fair0) * dec(b[2]) - 1 if b[2] else -9
                              r["fair"] = round(100 * fair0, 1)
                              if max(e0, e1) > 0:
                                  r["calls"]["pin_value"] = s0 if e0 > e1 else s1
                                  r["edge_pct"] = round(100 * max(e0, e1), 2)
                      elif a[1] != p[3]:
                          r["pin_gap"] = round(a[1] - p[3], 1)
                          if mkt == "spread":        # FD gives home more points than Pinnacle -> home
                              r["calls"]["pin_value"] = s0 if a[1] > p[3] else s1
                          else:                      # FD total above Pinnacle -> under
                              r["calls"]["pin_value"] = s1 if a[1] > p[3] else s0

                      p0 = next((x for x in prow if x[1] == mkt and x[2] == s0 and x[3] is not None), None)

                      # --- pin_bounce: has the move we are citing already retraced? DISPLAY ONLY.
                      #     pin_move and pin_rlm both compare FIRST-SEEN to CURRENT, so a number
                      #     that travelled 136.5 -> 131 -> 135 reports as a 1.5pt drop and looks
                      #     identical to one still on its way down. CBB UTEP@NMSU, 2026-11-19:
                      #     Pinnacle bottomed at 131 at 09:42 ET and had been climbing for 4.5h when
                      #     the board flagged it as "136.5 -> 132, the biggest move on the board".
                      #     The pick bought the bottom of a finished move and sat 2pts the wrong side
                      #     of the number within hours.
                      #     Measured and PRINTED, never gated: gating this is a signal change and
                      #     would reset the holdout. Decide that on evidence, not on one bad night.
                      if p0 and p0[3] is not None and p[3] is not None:
                          _s = [x[3] for x in prow
                                if x[1] == mkt and x[2] == s0 and x[3] is not None and x[0] <= t]
                          if mkt == "moneyline":
                              _s = [100 * imp(v) for v in _s if imp(v) is not None]
                          if len(_s) >= 2:
                              _lo, _hi, _a, _z = min(_s), max(_s), _s[0], _s[-1]
                              _b = ((_z - _lo) if _z < _a else (_hi - _z) if _z > _a
                                    else max(_z - _lo, _hi - _z))
                              r["pin_bounce"] = round(_b, 1)
                              r["pin_extreme"] = round(_lo if _z <= _a else _hi, 1)

                      # --- pin_move: Pinnacle's OWN number has travelled, and we take the side it
                      #     travelled toward. No public test, no money-ratio test, no comparison
                      #     with FanDuel -- that is the point. Pinnacle's POSITION relative to
                      #     FanDuel orders nothing (>= +1.0pt returns -5.2%, <= -1.0pt returns
                      #     -1.8%, no monotonicity across 2,950 markets); Pinnacle's MOTION orders
                      #     outcomes at every level of what FanDuel did. This signal reads the
                      #     motion and ignores the position.
                      if p0 and p0[3] is not None and p[3] is not None:
                          if mkt == "moneyline":
                              i1, i0 = imp(p[3]), imp(p0[3])
                              if i1 and i0 and abs(i1 - i0) >= 0.01:
                                  r["pin_move_to"] = s0 if i1 > i0 else s1
                                  r["pin_move_pts"] = round(100 * (i1 - i0), 1)
                                  r["calls"]["pin_move"] = r["pin_move_to"]
                          elif abs(p[3] - p0[3]) >= PIN_MOVE_MIN:
                              up = p[3] > p0[3]
                              to = (s1 if up else s0) if mkt == "spread" else (s0 if up else s1)
                              r["pin_move_to"] = to
                              r["pin_move_pts"] = round(abs(p[3] - p0[3]), 1)
                              r["calls"]["pin_move"] = to

                      if p0 and p0[3] != p[3] and None not in (a[3], b[3]):
                          if mkt == "moneyline":
                              i1, i0 = imp(p[3]), imp(p0[3])
                              pin_to = (s0 if i1 > i0 else s1) if (i1 and i0 and i1 != i0) else None
                          else:
                              up = p[3] > p0[3]
                              pin_to = (s1 if up else s0) if mkt == "spread" else (s0 if up else s1)
                          if pin_to:
                              r["pin_open"] = p0[3]
                              r["pin_moved_to"] = pin_to
                              # Pinnacle's own before/after ON THE FLAGGED SIDE. p0/p are the s0
                              # (home/over) row, so without this the board had two ways to lie:
                              # it printed FanDuel's current number next to Pinnacle's opening
                              # number ("KC@ATL moneyline 144 from 170" -- 144 was FanDuel, 170
                              # was Pinnacle, whose real move was 170 -> 160), and when the
                              # flagged side was the away/under it quoted the home/over price.
                              if pin_to == s0:
                                  r["pin_mv_from"], r["pin_mv_to"] = p0[3], p[3]
                              elif mkt == "moneyline":
                                  q0 = next((z for z in prow if z[1] == mkt and z[2] == s1
                                             and z[4] is not None), None)
                                  r["pin_mv_from"] = q0[4] if q0 else None
                                  r["pin_mv_to"] = q[4] if (q and q[4] is not None) else None
                              elif mkt == "spread":
                                  r["pin_mv_from"], r["pin_mv_to"] = -p0[3], -p[3]
                              else:                       # total / team total: same number, other side
                                  r["pin_mv_from"], r["pin_mv_to"] = p0[3], p[3]
                              tix = {s0: a[3], s1: b[3]}
                              mny = {s0: a[4], s1: b[4]}
                              pub = max(tix, key=lambda k: tix[k])
                              t_, m_ = tix.get(pin_to), mny.get(pin_to)
                              # the crowd is on the other side, and the money on this side is
                              # outsized relative to how few tickets it is
                              if (pub != pin_to and tix[pub] >= PUBLIC_MIN and t_
                                      and m_ is not None and (m_ / t_) >= RLM_RATIO_MIN):
                                  r["calls"]["pin_rlm"] = pin_to
                                  r["pin_rlm_tix"] = t_
                                  r["pin_rlm_ratio"] = round(m_ / t_, 2)
              return r


          def result(mkt, side, line, fin):
              if mkt.startswith("tt_"):
                  pts = fin["hs"] if mkt == "tt_home" else fin["as"]
                  x = pts - line if side == "over" else line - pts
                  return "W" if x > 0 else ("L" if x < 0 else "P")
              if mkt == "moneyline":
                  d = fin["hs"] - fin["as"] if side == "home" else fin["as"] - fin["hs"]
                  return "W" if d > 0 else ("L" if d < 0 else "P")
              if mkt == "spread":
                  m = fin["hs"] - fin["as"] if side == "home" else fin["as"] - fin["hs"]
                  x = m + line
              else:
                  tot = fin["hs"] + fin["as"]
                  x = tot - line if side == "over" else line - tot
              return "W" if x > 0 else ("L" if x < 0 else "P")


          def profit(odds, res):
              if res == "P" or odds is None: return 0.0
              if res == "L": return -1.0
              return 100.0 / -odds if odds < 0 else odds / 100.0


          def clv(mkt, side, v_then, v_close):
              if mkt.startswith("tt_"):
                  return round((v_close - v_then) if side == "over" else (v_then - v_close), 1)
              """closing-line value for a bet taken at v_then. Points for spread/total; for a
              moneyline there is no handicap, so it is percentage points of implied probability --
              positive means the market moved toward your side after you took it."""
              if mkt == "moneyline":
                  a, b = imp(v_then), imp(v_close)
                  return round(100 * (b - a), 1) if (a is not None and b is not None) else None
              if mkt == "spread": return round(v_then - v_close, 1)
              return round((v_close - v_then) if side == "over" else (v_then - v_close), 1)


          def bucket(x, table):
              if x is None: return None
              for lo, hi, lab in table:
                  if lo <= x < hi: return lab
              return None


          def favoured(mkt, side, r, fin=None):
              """Which side of this market is the 'default' one -- the favourite on a spread, the
              over on a total. Needed so a signal is scored against the base rate of the sides it
              actually picked, not against a coin flip. A model that is 73% dogs looks like genius
              in a week dogs cover."""
              if mkt == "total" or mkt.startswith("tt_"): return side == "over"
              home_line = r["line"].get("home")
              if home_line is None: return None
              if mkt == "moneyline":
                  away_line = r["line"].get("away")
                  if away_line is None: return None
                  fav = "home" if home_line < away_line else "away"   # shorter price = favourite
              else:
                  fav = "home" if home_line < 0 else "away"
              return side == fav


          # ------------------------------------------------------------------ build
          def build():
              games, ser, pin, finals = load()
              SBR, SBRCUR = load_sbr_openers()
              pin_keys = list(pin.keys())
              now = now_utc(); nowts = tsfmt(now)
              graded, upcoming, unmatched = [], [], 0
              for gid, g in games.items():
                  ko = iso_dt(g["kickoff"])
                  if not ko: continue
                  kots = tsfmt(ko)
                  pk = match_pin(g, pin_keys)
                  prow = pin.get(pk, []) if pk else []
                  topen = SBR.get(g["game"], {})
                  bks = SBRCUR.get(g["game"], {})
                  firsts = [s[0][0] for (gg, m, sd), s in ser.items() if gg == gid and s]
                  if not firsts: continue
                  first = min(firsts)
                  e_t = tsfmt(parse_ts(first) + dt.timedelta(minutes=EARLY_MIN))
                  rec = {"gid": gid, "game": g["game"], "away": g["away_name"], "home": g["home_name"],
                         "kickoff": g["kickoff"], "week": g.get("week"), "first_seen": first,
                         "pin_matched": bool(pk), "markets": {}}
                  if kots > nowts:
                      for mkt in MARKETS:
                          r = read(gid, mkt, nowts, ser, prow, topen.get(mkt), bks)
                          if r: rec["markets"][mkt] = {"now": r}
                      if rec["markets"]: upcoming.append(rec)
                      continue
                  fin = finals.get(gid)
                  if not fin:
                      unmatched += 1; continue
                  rec["final"] = f"{fin['as']}-{fin['hs']}"
                  rec["total_pts"] = fin["as"] + fin["hs"]
                  last_pre = tsfmt(ko - dt.timedelta(minutes=1))
                  for mkt in MARKETS:
                      cl = read(gid, mkt, last_pre, ser, prow, topen.get(mkt), bks)
                      if not cl: continue
                      ea = read(gid, mkt, e_t, ser, prow, topen.get(mkt), bks) if e_t < kots else None
                      out = {"close": cl}
                      if ea: out["early"] = ea
                      for cp, r in (("early", ea), ("close", cl)):
                          if not r: continue
                          gr = {}
                          for sig, side in r["calls"].items():
                              res = result(mkt, side, r["line"][side], fin)
                              gr[sig] = {"side": side, "line": r["line"][side], "odds": r["odds"][side],
                                         "res": res, "units": round(profit(r["odds"][side], res), 3),
                                         "took_fav": favoured(mkt, side, r)}
                              if cp == "early":
                                  gr[sig]["clv"] = clv(mkt, side, r["line"][side], cl["line"][side])
                          out[cp + "_graded"] = gr
                      rec["markets"][mkt] = out
                  if rec["markets"]: graded.append(rec)
              graded.sort(key=lambda r: r["kickoff"]); upcoming.sort(key=lambda r: r["kickoff"])
              src = collections.Counter(m.get("close", {}).get("open_src")
                                        for g in graded for m in g["markets"].values())
              print(f"openers: {dict(src)}  (sbr_open = true market opener, first_seen = our archive)")
              return graded, upcoming, unmatched


          def period_of(g):
              """fit = chosen-on, fwd = tested-on. See HOLDOUT_FROM."""
              return "fwd" if (g.get("kickoff") or "")[:10] >= HOLDOUT_FROM else "fit"


          def base_rates(graded, period=None):
              """How often the default side (favourite / over) actually won, measured on this
              sample. This is what a signal's hit rate has to beat, not 50%.

              Measured PER PERIOD. Scoring the forward test against the fit period's chalk
              rate would import exactly the bias the holdout exists to remove: the fit
              window ran 65.9% favourites, and a signal that is structurally long favourites
              would look like it had found something the moment dogs started covering."""
              nf = nw = no = ow = nm_ = mw = nt = tw = 0
              for g in graded:
                  if period and period_of(g) != period: continue
                  for mkt, m in g["markets"].items():
                      cl = m.get("close")
                      if not cl: continue
                      fin = g.get("final")
                      if not fin: continue
                      a, h = (int(x) for x in fin.split("-"))
                      f = {"as": a, "hs": h}
                      s0, s1 = SIDES[mkt]
                      for side in (s0, s1):
                          if favoured(mkt, side, cl) is not True: continue
                          res = result(mkt, side, cl["line"][side], f)
                          if res == "P": continue
                          if mkt == "spread":
                              nf += 1; nw += (res == "W")
                          elif mkt == "moneyline":
                              nm_ += 1; mw += (res == "W")
                          elif mkt.startswith("tt_"):
                              nt += 1; tw += (res == "W")
                          else:
                              no += 1; ow += (res == "W")
              return {"spread_fav_rate": (nw / nf) if nf else 0.5, "spread_n": nf,
                      "total_over_rate": (ow / no) if no else 0.5, "total_n": no,
                      "ml_fav_rate": (mw / nm_) if nm_ else 0.5, "ml_n": nm_,
                      "tt_over_rate": (tw / nt) if nt else 0.5, "tt_n": nt}


          def summarize(graded, brs):
              """brs maps period -> base rates, for "all", "fit" and "fwd"."""
              def blank(): return {"n": 0, "W": 0, "L": 0, "P": 0, "units": 0.0, "clv": [],
                                   "fav": 0, "dec": 0, "exp": 0.0}
              S = collections.defaultdict(blank)
              for g in graded:
                  per = period_of(g)
                  for mkt, m in g["markets"].items():
                      for cp in ("early", "close"):
                          gr = m.get(cp + "_graded") or {}
                          r = m.get(cp) or {}
                          tags = ["all", bucket(r.get("nb"), NB_BUCKETS), bucket(r.get("pin_lim"), LIM_BUCKETS)]
                          def rate_for(p):
                              br = brs[p]
                              return (br["spread_fav_rate"] if mkt == "spread" else
                                      br["ml_fav_rate"] if mkt == "moneyline" else
                                      br["tt_over_rate"] if mkt.startswith("tt_") else
                                      br["total_over_rate"])
                          # singles, then every PAIR of signals that agree on a side. Signals are
                          # not independent bets -- they are evidence, and evidence combines. Two
                          # that each look like nothing alone can be worth something together:
                          # minority tickets is 42.9% on its own and line-moved-toward is 49.8%,
                          # but the two together are 52.7%.
                          items = list(gr.items())
                          pairs = [(f"{p}+{q}", {**gr[p], "res": gr[p]["res"]})
                                   for p, q in itertools.combinations(sorted(gr), 2)
                                   if gr[p]["side"] == gr[q]["side"]]
                          for sig, x in items + pairs:
                              for tag in tags:
                                  if not tag: continue
                                  for mk in (mkt, "both"):
                                      # "all" keeps the pooled view; the period keys are the
                                      # fit/forward split and are the ones that carry meaning.
                                      for pr in ("all", per):
                                          s = S[(sig, cp, mk, tag, pr)]
                                          rate = rate_for(pr)
                                          s["n"] += 1; s[x["res"]] += 1; s["units"] += x["units"]
                                          if "clv" in x: s["clv"].append(x["clv"])
                                          if x["res"] != "P" and x.get("took_fav") is not None:
                                              s["dec"] += 1
                                              s["fav"] += bool(x["took_fav"])
                                              s["exp"] += rate if x["took_fav"] else (1 - rate)
              out = []
              for (sig, cp, mk, tag, pr), s in S.items():
                  dec = s["W"] + s["L"]
                  hit = s["W"] / dec if dec else None
                  z = (s["W"] - dec * BREAKEVEN) / math.sqrt(dec * 0.25) if dec else None
                  row = {"signal": sig, "checkpoint": cp, "market": mk, "slice": tag,
                         "period": pr, "n": s["n"],
                         "W": s["W"], "L": s["L"], "P": s["P"],
                         "hit_pct": round(100 * hit, 1) if hit is not None else None,
                         "units": round(s["units"], 2),
                         "roi_pct": round(100 * s["units"] / s["n"], 1) if s["n"] else None,
                         "z_vs_breakeven": round(z, 2) if z is not None else None}
                  if s["dec"]:
                      exp = 100 * s["exp"] / s["dec"]
                      row["picked_default_pct"] = round(100 * s["fav"] / s["dec"], 1)
                      row["expected_pct"] = round(exp, 1)
                      row["edge_pts"] = round(100 * s["W"] / dec - exp, 1) if dec else None
                  if s["clv"]:
                      c = sorted(s["clv"])
                      row["clv_avg"] = round(sum(c) / len(c), 2)
                      row["clv_pos_pct"] = round(100 * sum(1 for x in c if x > 0) / len(c), 1)
                  e = row.get("edge_pts")
                  if dec >= MIN_N:
                      verdict = (
                          "PROMOTE: beats break-even and its own base rate" if z >= 1.5 and (e or 0) >= 5 else
                          "beats break-even but not its base rate -- directional bias, not signal"
                          if z >= 1.5 else
                          "INVERT candidate: wrong well beyond its base rate" if (e or 0) <= -15 else
                          "DROP: below break-even" if z <= -1.5 else "no edge shown yet")
                      # A verdict reached on the data the signal was built from is a hypothesis
                      # about the future, not a finding about it. Only the forward period can
                      # confirm one, so the fit period's labels say so out loud.
                      row["proposal"] = (f"HYPOTHESIS (in-sample) -- {verdict}" if pr == "fit"
                                         else verdict)
                  else:
                      row["proposal"] = f"keep collecting ({dec}/{MIN_N})"
                  out.append(row)
              # mark pairs that merely restate a component: same W-L as one of its own halves
              single = {(r["signal"], r["checkpoint"], r.get("market"), r["slice"], r["period"]):
                        (r["W"], r["L"]) for r in out if "+" not in r["signal"]}
              for r in out:
                  if "+" not in r["signal"]: continue
                  a, b = r["signal"].split("+", 1)
                  rec_ = (r["W"], r["L"])
                  for comp in (a, b):
                      if single.get((comp, r["checkpoint"], r.get("market"),
                                     r["slice"], r["period"])) == rec_:
                          r["redundant_with"] = comp
                          r["proposal"] = f"redundant -- identical record to {comp} alone, not independent confirmation"
                          break

              order = {s: i for i, s in enumerate(SIGNALS)}
              perord = {"all": 0, "fit": 1, "fwd": 2}
              out.sort(key=lambda r: (perord.get(r["period"], 9), r["slice"] != "all",
                                      r["market"] != "both", r["checkpoint"],
                                      "+" in r["signal"], order.get(r["signal"], 9),
                                      r["market"], r["slice"]))
              return out


          def fmt_rec(r):
              return f"{r['W']}-{r['L']}" + (f"-{r['P']}" if r["P"] else "")


          def scorecard_md(summary, graded, unmatched, brs, gen):
              br = brs["all"]
              nfit = sum(1 for g in graded if period_of(g) == "fit")
              nfwd = len(graded) - nfit
              L = ["# NFL scorecard", "",
                   f"Generated {gen}. {len(graded)} graded games"
                   f" ({unmatched} finished games had no final score and are not graded).", "",
                   "## Read this first: fit vs forward", "",
                   f"**{nfit} games before {HOLDOUT_FROM} (fit) · {nfwd} on or after it (forward).**",
                   "",
                   "Every signal here, every threshold, and every PROMOTE/DROP label this scorecard",
                   f"has printed was chosen while looking at the games before {HOLDOUT_FROM}.",
                   "Scoring those choices on those same games is grading the exam you studied from.",
                   "`pin_value` was 108-68 in CBB first halves and 10-1 on NFL spreads; both numbers",
                   "were fitted and scored on one sample, and neither has ever been tested on a game",
                   "it did not help choose. So every record below appears twice:", "",
                   "- **FIT** — in-sample. A label here is a **hypothesis**. It is what we guessed.",
                   "- **FORWARD** — out-of-sample. A label here is **evidence**. It is what happened.",
                   "",
                   "Base rates are measured separately in each period. Scoring the forward test",
                   "against the fit window's chalk rate would re-import the bias the split exists to",
                   "remove — the fit window ran",
                   f"{100*brs['fit']['spread_fav_rate']:.1f}% favourites, and a signal that is",
                   "structurally long favourites would look like a discovery the week dogs cover.",
                   "",
                   "The board follows the same rule: a signal is weighted by its FIT edge until it",
                   f"has {MIN_N} decided forward outcomes, and by its FORWARD edge from then on. It",
                   "migrates onto out-of-sample evidence on its own, with no hand-tuning.", "",
                   "**Changing any threshold moves the holdout date to the day of the change and",
                   "restarts the forward test.** That is the real cost of fiddling with the engine,",
                   "and it is deliberately expensive.", "",
                   "Each signal is graded on **every** game it had an opinion on, at the FanDuel price",
                   "available at that moment. EARLY = one hour after the line was first seen. CLOSE =",
                   "last number before kickoff. Break-even at -110 is 52.4%. CLV = points of",
                   "closing-line value; positive means the number you would have taken beat the close.",
                   "",
                   "`expected %` is the base rate of the sides that signal actually picked, measured on",
                   "this sample. `edge` is hit% minus that. A signal that is structurally long dogs or",
                   "unders will beat 50% in any week dogs or unders run, which is not an edge --",
                   f"this sample ran **{100*br['spread_fav_rate']:.1f}% favourites** (n={br['spread_n']})",
                   f"**{100*br['total_over_rate']:.1f}% overs** (n={br['total_n']}) and "
                   f"**{100*br['ml_fav_rate']:.1f}% moneyline favourites** (n={br['ml_n']}) and "
                   f"**{100*br['tt_over_rate']:.1f}% team-total overs** (n={br['tt_n']}).", "",
                   "Moneyline has no handicap, so its `follow_move` reads price, its CLV is",
                   "percentage points of implied probability, and `pin_value` is a pure price",
                   "comparison against Pinnacle's no-vig fair -- no half-points involved.", "",
                   f"Proposals appear once a signal has {MIN_N} decided games. Nothing changes",
                   "automatically.", "",
                   "**Gate B is these signals. Gate A is the Pinnacle columns on the board — a price",
                   "floor, never a veto.** EV against Pinnacle can essentially never be positive,",
                   "because Pinnacle is the fair-value definition. Using it as a veto rejects every",
                   "signal this system exists to find. See fault 4 in propwatch-news-vs-coherence.md.",
                   ""]
              # FORWARD first and FIT second, on purpose: the out-of-sample table is the one
              # that means anything, so it should not be below two screens of fitted numbers.
              for per, head, note in (
                      ("fwd", "FORWARD (out-of-sample — this is the evidence)",
                       f"Games kicking off on or after {HOLDOUT_FROM}. Nothing in the engine was "
                       f"chosen using these. n={nfwd} games."),
                      ("fit", "FIT (in-sample — this is the hypothesis)",
                       f"Games before {HOLDOUT_FROM}. The signals and thresholds were chosen by "
                       f"looking at these, so a strong record here is expected and proves nothing. "
                       f"n={nfit} games.")):
                  L += [f"# {head}", "", note, ""]
                  if per == "fwd" and nfwd == 0:
                      L += ["*No games yet. The forward test starts with the next kickoff.*", ""]
                      continue
                  for cp in ("early", "close"):
                      L += [f"## {cp.upper()}  ({per})", "",
                            "| signal | market | record | hit % | expected % | edge | units | ROI % | CLV avg | CLV + % | status |",
                            "|---|---|---|---|---|---|---|---|---|---|---|"]
                      for r in summary:
                          if (r["slice"] != "all" or r["checkpoint"] != cp
                                  or r["period"] != per): continue
                          L.append(f"| {r['signal']} | {r['market']} | {fmt_rec(r)} | {r['hit_pct']} | "
                                   f"{r.get('expected_pct', '')} | {r.get('edge_pts', '')} | "
                                   f"{r['units']:+} | {r['roi_pct']} | {r.get('clv_avg', '')} | "
                                   f"{r.get('clv_pos_pct', '')} | {r['proposal']} |")
                      L.append("")
              L += ["# Pooled (fit + forward together)", "",
                    "Kept for continuity with earlier runs. **This table is contaminated** — it",
                    "mixes the games the engine was built on with the games testing it. Use the",
                    "forward table for any decision.", ""]
              for cp in ("early", "close"):
                  L += [f"## {cp.upper()}  (pooled)", "",
                        "| signal | market | record | hit % | expected % | edge | units | ROI % | CLV avg | CLV + % | status |",
                        "|---|---|---|---|---|---|---|---|---|---|---|"]
                  for r in summary:
                      if (r["slice"] != "all" or r["checkpoint"] != cp
                              or r["period"] != "all"): continue
                      L.append(f"| {r['signal']} | {r['market']} | {fmt_rec(r)} | {r['hit_pct']} | "
                               f"{r.get('expected_pct', '')} | {r.get('edge_pts', '')} | "
                               f"{r['units']:+} | {r['roi_pct']} | {r.get('clv_avg', '')} | "
                               f"{r.get('clv_pos_pct', '')} | {r['proposal']} |")
                  L.append("")
              L += ["## By ticket volume and Pinnacle limit (both markets, pooled)", "",
                    "| signal | checkpoint | slice | record | hit % | edge | ROI % | CLV avg |",
                    "|---|---|---|---|---|---|---|---|"]
              for r in summary:
                  if (r["slice"] == "all" or r["market"] != "both"
                          or r["period"] != "all"): continue
                  L.append(f"| {r['signal']} | {r['checkpoint']} | {r['slice']} | {fmt_rec(r)} | "
                           f"{r['hit_pct']} | {r.get('edge_pts', '')} | {r['roi_pct']} | "
                           f"{r.get('clv_avg', '')} |")
              return "\n".join(L) + "\n"


          def flagged_md(live, summary, rec_of, label_of):
              """Reverse line movement WITH public-split confirmation, pulled to the top of the
              board instead of buried in a signal list. Three tiers:
                PINNACLE moved against the public  (pin_rlm)    -- the sharp book repricing
                FanDuel moved against the public   (rlm_ratio)  -- a retail book reacting
                line moved off a >=60% public side (rlm)        -- no money-ratio requirement

              The third tier exists because the first two were screening out the stated rule.
              pin_rlm and rlm_ratio both demand that the side the line moved TOWARD carries at
              least RLM_RATIO_MIN times its share of money. The original template is about the
              side the line moved AWAY from: the crowd holds the tickets AND the money, and the
              number goes the other way regardless. IND@HOU on 2026-11-19 was exactly that --
              73% of tickets and 76% of money on the over, total 44.5 -> 43.5, 17,670 bets, the
              heaviest volume on the card -- and it appeared nowhere, because the under's money
              ratio was 0.89. Plain `rlm` fired on it and had no surface to appear on.

              Tier 3 is intentionally the weakest and is labelled so: `rlm` is 5-17 in NFL. It is
              here to be SEEN and graded, not to be trusted."""
              hits = []
              for x in live:
                  r = x["now"] if "now" in x else x
                  for rank, (sig, tier) in enumerate((
                          ("pin_rlm", "PINNACLE moved vs public"),
                          ("rlm_ratio", "FanDuel moved vs public"),
                          ("rlm", "line moved off the public (no ratio test)"))):
                      sd = r["calls"].get(sig)
                      # don't repeat a market in tier 3 that a stronger tier already showed
                      if sig == "rlm" and (r["calls"].get("pin_rlm") == sd
                                           or r["calls"].get("rlm_ratio") == sd): continue
                      if sd: hits.append((rank, tier, sig, sd, x, r))
              if not hits: return []
              hits.sort(key=lambda h: (h[0], label_of(h[4])))
              L = ["## FLAGGED — reverse line movement with split confirmation", "",
                   "The crowd holds the tickets on the other side, the money on this side is",
                   f"outsized relative to its ticket count (>= {RLM_RATIO_MIN}x), and the number moved",
                   "here anyway. Pinnacle tier first: that is the sharp book moving, not a retail",
                   "book reacting to its own flow.", "",
                   "",
                   "`moved` is **that tier's own book** moving — Pinnacle's number for the Pinnacle",
                   "tier, FanDuel's for the FanDuel tier. `FD now` is what you would actually be",
                   "buying. Those are two different books and this table used to print one next to",
                   "the other in a single row.", "",
                   "`retraced` is how far Pinnacle's number has already come BACK against the move",
                   "in the `moved` column. `moved` compares first-seen with current, so a number",
                   "that went 136.5 -> 131 -> 135 prints as a drop while it is actually climbing.",
                   "A large `retraced` means the move is finished and reversing, and you would be",
                   "buying the wrong end of it. This is shown, not gated -- it is not a signal.", "",
                   "| tier | game | market | side | book | moved | retraced | FD now | tickets | money/tix | record |",
                   "|---|---|---|---|---|---|---|---|---|---|---|"]
              for _, tier, sig, sd, x, r in hits:
                  s = rec_of(sig)
                  pin = sig == "pin_rlm"
                  book = "Pinnacle" if pin else "FanDuel"
                  # NOT r["open"] -- that is the s0 (home/over) opener, and printing it beside an
                  # away/under flag showed another side's number: Tennessee's moneyline read
                  # "-450 -> 330" (-450 was DALLAS's opener) and Miami's spread read "-17 -> 16.5",
                  # a sign flip. open_side carries the flagged side's own opener; use it.
                  frm = r.get("pin_mv_from") if pin else (r.get("open_side") or {}).get(sd, r.get("open"))
                  to_ = r.get("pin_mv_to") if pin else (r.get("line") or {}).get(sd)
                  tx = r.get("pin_rlm_tix") if pin else (r.get("tix") or {}).get(sd)
                  rt = r.get("pin_rlm_ratio") if pin else r.get("mny_ratio")
                  ln = (r.get("line") or {}).get(sd)
                  # A flagged side whose own number never moved is honest information, not a move:
                  # the signal fired on the OTHER side's price shifting (Pinnacle re-vigging one
                  # side only). Say so rather than printing "139 -> 139" as though it moved.
                  mv = ("" if None in (frm, to_) else
                        f"{frm:g} (other side moved)" if frm == to_ else f"{frm:g} -> {to_:g}")
                  _bo = r.get("pin_bounce")
                  bo = "" if _bo is None else ("—" if _bo < 0.5 else f"**+{_bo:g}**")
                  L.append(f"| {tier} | {label_of(x)} | {x.get('market', r.get('mkt',''))} | {sd} | "
                           f"{book} | {mv} | {bo} | {ln if ln is not None else ''} | "
                           f"{tx}% | {rt} | {s} |")
              L.append("")
              return L


          def s0_of(mkt):
              """The side pin_gap and the other stored scalars are framed in."""
              return SIDES[mkt][0]


          def board_md(upcoming, summary, gen):
              rec = {(r["signal"], r["market"], r["period"]): r for r in summary
                     if r["slice"] == "all" and r["checkpoint"] == "close"}

              def rec2(sig, mkt):
                  """fit record, then forward record. Both, always -- a signal with a glowing
                  fitted record and a losing forward record should look like what it is."""
                  # no "|" in here -- these land inside markdown table cells, and a pipe
                  # silently splits the column and shifts every field after it.
                  f_ = rec.get((sig, mkt, "fit")); w_ = rec.get((sig, mkt, "fwd"))
                  return f"{fmt_rec(f_) if f_ else '0-0'} fit · {fmt_rec(w_) if w_ else '0-0'} fwd"
              L = ["# NFL board", "",
                   f"Generated {gen}. Upcoming games with a FanDuel line, grouped by how many signals",
                   "agree on each market. Every game is listed; nothing is cut. Each call shows that",
                   "signal's graded CLOSE record so far, so you can see which ones are earning.", "",
                   "`Pin` is Pinnacle's number and the size it will take — **Gate A, a price floor and",
                   "a guide to which book to use. It is not a veto.** `gap` is FanDuel minus Pinnacle in",
                   "points. `public` names the ticket majority when it is over "
                   f"{PUBLIC_MIN}% — when the line has",
                   "moved the other way, `rlm` fires.", "",
                   "This is analysis, not picks.", ""]
              flat = [{"game": g["game"], "market": mkt, "now": m["now"]}
                      for g in upcoming for mkt, m in g["markets"].items() if m.get("now")]
              L += flagged_md(flat, summary,
                              lambda sig: rec2(sig, "both"),
                              lambda x: x["game"])
              # WEIGHT BY RECORD, NOT BY HEADCOUNT.
              # Ranking by "how many signals agree" treats a 147-180 signal as equal evidence to a
              # 56-37 one, so a market can show "7 agree, 0 against" while four of the seven have
              # never earned anything. That is engine defect 3 in a new costume: counting
              # restatements instead of independent confirmation.
              #
              # Each signal contributes its own base-rate-corrected edge in points, and only once
              # it has MIN_N decided outcomes -- an unproven signal contributes ZERO rather than
              # borrowing credibility from the ones beside it. Signals that oppose the lean
              # subtract. Pairs already flagged `redundant_with` identify signals that are not
              # independent (rlm_ratio REQUIRES follow_move, so counting both counts one thing
              # twice); the subsumed one is dropped from the score.
              # Weights are PER MARKET where the sample allows, falling back to the all-market
              # number otherwise. pin_value is +36 on spreads and 18-18 on team totals -- one
              # pooled weight would carry its spread record into markets where it has none.
              #
              # Which period's edge does a weight come from? The forward record is the only
              # honest estimate, but on day one it is empty, and a board that weights
              # everything at zero ranks nothing. So: use the FORWARD edge as soon as a
              # signal has MIN_N decided forward outcomes, and the FIT edge until then. The
              # board migrates onto out-of-sample evidence by itself as the season runs, and
              # a signal whose fitted edge does not survive contact loses its weight without
              # anyone deciding to take it away.
              W, SUB = {}, {}
              for per in ("fit", "fwd"):
                  for row in summary:
                      if (row["slice"] != "all" or row["checkpoint"] != "close"
                              or row["period"] != per): continue
                      sig, mk = row["signal"], row.get("market")
                      if "+" in sig:
                          if row.get("redundant_with") and mk == "both" and per == "fit":
                              a_, b_ = sig.split("+", 1)
                              SUB[b_ if row["redundant_with"] == a_ else a_] = row["redundant_with"]
                          continue
                      dec_ = row["W"] + row["L"]
                      if per == "fwd" and dec_ < MIN_N:
                          continue          # not enough forward evidence yet -- keep the fit weight
                      W[(sig, mk)] = (round(row.get("edge_pts") or 0.0, 1),
                                      round(row.get("roi_pct") or 0.0, 1), dec_, per)

              def wt(sig, mkt):
                  """A signal's weight is its base-rate-corrected edge IN THIS MARKET, shrunk toward
                  zero by n/(n+K).

                  Two failures this avoids. A hard cutoff creates a cliff: pin_value is 10-1 on
                  NFL spreads, edge +36, and at any cutoff of 10 or less that single thin record
                  dominates every other input on the board. And using one pooled weight carries a
                  signal's record from the market where it works into markets where it does not --
                  pin_value is +36 on spreads and 18-18 on team totals.

                  Shrinkage handles both without an arbitrary line: 10-1 keeps about a third of its
                  apparent edge, a 66-game record keeps about three quarters, and a market with no
                  record of its own borrows the pooled number under the same discount."""
                  v = W.get((sig, mkt))
                  if not v or v[2] == 0:
                      v = W.get((sig, "both"))
                  if not v or v[2] == 0:
                      return 0.0
                  e_m, roi_m, n_m, _p = v
                  # WEIGHT BY ROI, NOT BY HIT-RATE EDGE, and require BOTH to be positive.
                  #
                  # Hit-rate edge was the right correction to raw win rate, but it is the wrong
                  # CURRENCY once prices vary. On spreads and totals everything is near -110, so
                  # edge and ROI rank the same and the difference never showed. On moneylines
                  # they come apart completely: money_level on CBB moneylines is 312-113, hit
                  # 73.4% against a 69.8% base rate -- edge +3.6, so it earned positive weight --
                  # while returning -3.5% and -14.87 units, because it is laying -880 favourites.
                  # On 2026-11-17 that ranked a -880 chalk moneyline as the best play on the
                  # board. A signal has to beat its base rate AND make money; ROI alone could be
                  # flattered by a sample where one side simply kept winning, and edge alone is
                  # blind to price, so neither test is dropped.
                  w_ = roi_m if (roi_m <= 0 or e_m >= 0) else 0.0
                  return round(w_ * n_m / (n_m + SHRINK_K), 1) if n_m else 0.0

              def wt_src(sig, mkt):
                  """"fit" or "fwd" -- which period that weight came from, shown on the board so
                  a lean built on fitted numbers is never mistaken for a tested one."""
                  v = W.get((sig, mkt)) or W.get((sig, "both"))
                  return v[3] if v else "fit"

              def score(calls, side, mkt):
                  keep = {g_ for g_ in calls if SUB.get(g_) not in calls}
                  pos = sum(wt(g_, mkt) for g_ in keep if calls[g_] == side)
                  neg = sum(wt(g_, mkt) for g_ in keep if calls[g_] != side)
                  return round(pos - neg, 1)

              def band(sc):
                  # Thresholds doubled with the switch from edge points to ROI %: at -110,
                  # ROI = 1.909p - 1, so a 5-point hit-rate edge is about +9.6% ROI. Same bands,
                  # restated in the new currency.
                  return ("A  weighted ROI >= +20%" if sc >= 20 else
                          "B  weighted ROI +10% to +20%" if sc >= 10 else
                          "C  weighted ROI 0 to +10%" if sc > 0 else
                          "D  no weighted edge (agreement is all unproven or money-losing signals)")

              groups = collections.defaultdict(list)
              for g in upcoming:
                  for mkt, m in g["markets"].items():
                      r = m["now"]
                      if not r["calls"]: continue
                      tally = collections.Counter(r["calls"].values())
                      side, n = tally.most_common(1)[0]
                      sc = score(r["calls"], side, mkt)
                      # A SPLIT market -- signals genuinely pointing opposite ways -- averages out
                      # to a weak score and sinks to band D, where it reads as "nothing here".
                      # That is the opposite of the truth: our own inputs disagreeing is more
                      # interesting than nothing firing. IND@HOU 2026-11-19: 4 signals over,
                      # 2 under, 17,670 bets (heaviest on the card), weighted -6.2, bottom of the
                      # page. Marked and sorted first within its band so it gets looked at.
                      opp = len(r["calls"]) - n
                      groups[band(sc)].append((g, mkt, r, side, sc, n, opp, n >= 2 and opp >= 2))
              L += ["Ranked by **weighted ROI**: each agreeing signal contributes its own return per",
                    "unit risked, and contributes nothing until it has 30 decided outcomes. A signal",
                    "earns positive weight only if it **both** beats its own base rate and makes",
                    "money. Hit-rate edge alone is blind to price — `money_level` on CBB moneylines",
                    "beats its base rate by 3.6 points while returning −3.5%, because it lays −880",
                    "favourites, and on 2026-11-17 that ranked a −880 chalk first on the board.",
                    "Raw agreement count is shown too, but it is the weaker number — a",
                    "market can have seven signals agreeing where four of them have losing records.",
                    "",
                    "**SPLIT** marks a market where at least two signals point each way. Those average",
                    "to a weak score and land in band D looking empty, when in fact our inputs are",
                    "in conflict — usually the markets worth the most attention. They sort first",
                    "inside whatever band they fall in.",
                    "",
                    "Each call shows **two** records: `fit` (the games the signal was chosen on —",
                    f"before {HOLDOUT_FROM}, so a good number there proves nothing) and `fwd` (games",
                    "since, which it had no hand in choosing). A `*` means the weight came from the",
                    f"forward record, which happens once that record reaches {MIN_N} decided",
                    "outcomes. No asterisk means the lean rests on fitted numbers only.",
                    ""]
              for b in sorted(groups):
                  L += [f"## {b}", "",
                        "| kickoff (ET) | game | market | lean | wt ROI | raw | FD now | open | move | "
                        "Pin | gap | public | tix / money (lean) | bets | calls |",
                        "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"]
                  for g, mkt, r, side, sc, nag, nag_ag, split in sorted(
                          groups[b], key=lambda x: (not x[7], -x[4], x[0]["kickoff"])):
                      k = iso_dt(g["kickoff"])
                      ko = (k - dt.timedelta(hours=5)).strftime("%a %H:%M") if k else ""
                      parts = []
                      for sig, sd in r["calls"].items():
                          parts.append(f"{sig}->{sd} ({rec2(sig, mkt)}"
                                       + ("*)" if wt_src(sig, mkt) == "fwd" else ")"))
                      pv = (r.get("pin_side") or {}).get(side, r.get("pin"))
                      pin = (f"{pv:g} (${r['pin_lim']:,.0f})"
                             if pv is not None and r.get("pin_lim") else "")
                      # Flag a Pinnacle move that has already retraced against itself. Appended to
                      # the Pin cell rather than given a column -- this table is wide enough, and
                      # the note only wants the eye when there is something to see.
                      _bo = r.get("pin_bounce")
                      if pin and _bo is not None and _bo >= 1.0:
                          pin += f" **retraced +{_bo:g}**"
                      ov = (r.get("open_side") or {}).get(side, r.get("open"))
                      op = f"{ov:g}" if ov is not None else ""
                      mv = f"{r['move_pts']:g}" if r.get("move_pts") else ""
                      # LEAN-ORIENTED. pin_gap is stored in the s0 (home/over) frame, so printing
                      # it raw next to an away/under lean inverts its meaning: TEN@DAL +7.5 showed
                      # "+0.5" while actually being half a point WORSE than Pinnacle. Positive here
                      # always means "FanDuel's number is better for the side we are leaning".
                      # NOTE this is information, not a gate. Graded 2026-11-19 over 2,950 CBB
                      # markets, the gap does not order outcomes at all: >= +1.0 returns -5.2%,
                      # same number -3.5%, <= -1.0 returns -1.8%. Five buckets, no monotonicity.
                      # Plays were being cut on this with no evidence behind it.
                      _g = r.get("pin_gap")
                      if _g is None:
                          gap = ""
                      else:
                          _o = _g if side in (s0_of(mkt),) else -_g
                          gap = f"{_o:+g}"
                      pub = (f"{r['public_side']} {r['public_tix']}%" if r.get("public_side") else "")
                      odds = f" ({r['odds'][side]:+d})" if r["odds"][side] is not None else ""
                      tm = (f"{r['tix'][side]}% / {r['mny'][side]}%"
                            if r["tix"][side] is not None and r["mny"][side] is not None else "")
                      L.append(f"| {ko} | {g['game']} | {mkt} | "
                               f"{side}{' **SPLIT**' if split else ''} | {sc:+g} | {nag}-{nag_ag} | "
                               f"{r['line'][side]:g}{odds} | "
                               f"{op} | {mv} | {pin} | {gap} | {pub} | {tm} | {r['nb'] or ''} | "
                               f"{'; '.join(parts)} |")
                  L.append("")
              if not groups: L.append("No upcoming games with signals yet.")
              return "\n".join(L) + "\n"


          if __name__ == "__main__":
              graded, upcoming, unmatched = build()
              brs = {p_: base_rates(graded, None if p_ == "all" else p_)
                     for p_ in ("all", "fit", "fwd")}
              br = brs["all"]
              summary = summarize(graded, brs)
              gen = now_utc().strftime("%Y-%m-%d %H:%M UTC")
              nfit = sum(1 for g in graded if period_of(g) == "fit")
              os.makedirs(C("graded"), exist_ok=True)
              json.dump(graded, open(C("graded", "games.json"), "w"), indent=1)
              json.dump({"generated": gen, "graded_games": len(graded), "unmatched_finals": unmatched,
                         "min_n_to_propose": MIN_N, "holdout_from": HOLDOUT_FROM,
                         "fit_games": nfit, "forward_games": len(graded) - nfit,
                         "base_rates": brs, "signals": summary},
                        open(C("graded", "summary.json"), "w"), indent=1)
              open(C("SCORECARD.md"), "w").write(scorecard_md(summary, graded, unmatched, brs, gen))
              open(C("BOARD.md"), "w").write(board_md(upcoming, summary, gen))
              print(f"graded games: {len(graded)}   upcoming on board: {len(upcoming)}   "
                    f"finished but no final: {unmatched}")
              print(f"base rates: {100*br['spread_fav_rate']:.1f}% favourites (n={br['spread_n']}), "
                    f"{100*br['total_over_rate']:.1f}% overs (n={br['total_n']}), "
                    f"{100*br['ml_fav_rate']:.1f}% ML favs (n={br['ml_n']}), "
                    f"{100*br['tt_over_rate']:.1f}% TT overs (n={br['tt_n']})")
              print(f"holdout {HOLDOUT_FROM}: {nfit} fit games, {len(graded)-nfit} forward games")
              for per in ("fwd", "fit"):
                  rows = [r for r in summary
                          if r["slice"] == "all" and r["market"] == "both" and r["period"] == per
                          and ("+" not in r["signal"] or (r["W"] + r["L"]) >= 12)]
                  print(f"--- {per.upper()} ---" + ("  (empty -- starts at next kickoff)"
                                                    if not rows else ""))
                  for r in rows:
                      print(f"  {r['checkpoint']:5} {r['signal']:13} {fmt_rec(r):>9}  hit {r['hit_pct']}"
                            f"  exp {r.get('expected_pct')}  edge {r.get('edge_pts')}"
                            f"  roi {r['roi_pct']}  clv {r.get('clv_avg', '-')}  {r['proposal']}")

          PY

      - name: Commit
        run: |
          git config user.name  "propwatch-bot"
          git config user.email "propwatch-bot@users.noreply.github.com"
          git add nfl/graded nfl/SCORECARD.md nfl/BOARD.md
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "nfl grade $(date -u +%FT%TZ)"
          git pull --rebase -q || true
          git push
